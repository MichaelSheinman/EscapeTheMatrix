# Tier 5, the top of the ladder. No `hired` and no `interview` on purpose —
# out of reach until #28 gives the upper rungs a way in.

tier: 5
name: Firm principal
shift: "07:00"

posting:
  intro: >-
    An established practice seeks a principal to own its work, clients,
    and results.
  duties:
    - Set the firm's direction; make the final call on all work
