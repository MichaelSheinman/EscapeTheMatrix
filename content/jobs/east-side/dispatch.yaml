# Tier 2. The tolls read in chasing and pressing drivers, and in a plan that
# falls apart daily.

tier: 2
name: Transport dispatcher
shift: "07:00"

posting:
  intro: >-
    Transport office on the warehouse strip needs a dispatcher to keep
    a delivery fleet on schedule.
  duties:
    - Assign routes and dispatch the driver roster
    - Chase late drivers and press for arrival times
    - Rework routes as breakdowns and delays come in
    - Log exceptions and report missed windows
  qualifications:
    - Firm on the phone with drivers who push back
    - Calm and organized when schedules change last minute
    - Dispatch or logistics experience expected

premium: 3400
toll:
  kindness: -6
  stability: -2

hired: { at: the-strip-warehouse, zone: desk }
interview: interview/a
offered: [offered, start-monday]
