# The tolls read in enforcing club rules, turning away lapsed memberships,
# and covering the desk alone at night. The health floor is the club's, not
# the work's: they hire the desk they want members to see.

name: Overnight gym front desk associate
shift: "20:00"
pay: 9800
hours: 8
requires:
  health: 30

posting:
  intro: >-
    Overnight cover at a 24-hour gym. You will be the only staff member
    on the floor, controlling door access and handling anything that
    comes up.
  duties:
    - Check in members and control after-hours door access
    - Sign up walk-ins and explain membership terms
    - Enforce club rules; turn away lapsed memberships
    - Handle incidents and call for assistance when needed
    - Keep the desk and lobby area presentable
  qualifications:
    - Comfortable covering the desk alone
    - Able to hold a firm line on club policy
    - No experience required

toll:
  kindness: -4
  stability: -2

hired: { at: riverfront-gym, zone: counter }
