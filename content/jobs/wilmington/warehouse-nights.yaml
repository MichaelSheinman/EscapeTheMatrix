# No toll, no floor, no route in: it takes anybody, which is what an
# entry-level posting is. What it costs is ten hours of nights.
#
# The loading bay and not the warehouse beside it: one place hires one role,
# and the desk at the transport office is a different job.

name: Overnight warehouse operative
shift: "21:00"
pay: 8800
hours: 10

posting:
  intro: >-
    Distribution warehouse on the strip is hiring general operatives
    for the overnight loading dock.
  duties:
    - Unload inbound trucks; stack and wrap pallets
    - Scan stock in and out of the racks
    - Load outbound trailers to the pick sheet
    - Keep the dock swept and clear
  qualifications:
    - Able to lift and stay on your feet
    - No experience required; training on the job

hired: { at: wilmington-loading-bay, zone: dock }
