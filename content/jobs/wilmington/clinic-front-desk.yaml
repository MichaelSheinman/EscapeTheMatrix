# The tolls read in reassuring the unwell, and in juggling the window, the
# phones and the queue. Three weeks of any front-of-house night work is the
# route in: the clinic wants somebody who has handled the public alone.

name: Walk-in clinic receptionist
shift: "08:00"
pay: 15200
hours: 9
fed: true
requires:
  intelligence: 15
  stability: 20

posting:
  intro: >-
    Walk-in clinic seeks a receptionist to run a busy front desk and
    keep patients moving through.
  duties:
    - Greet and register walk-in patients
    - Answer phones while managing the front window
    - Reassure waiting patients and explain wait times
    - Keep records current and route paperwork to staff
  qualifications:
    - Patient and calm with people who are unwell
    - Able to juggle phones, the window, and the queue
    - Front desk or reception experience expected

toll:
  kindness: 4
  stability: -2

experience:
  any_of:
    - all_of:
        corner-shop-nights: 20
    - all_of:
        gym-front-desk: 20
    - all_of:
        tower-lobby-nights: 20

hired: { at: wilmington-clinic, zone: counter }
interview: interview/c
offered: [taken-on, start-monday]
