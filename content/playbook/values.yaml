# The numbers a parameterised term may hold — and the whole of them.
#
# HighLevelOverview.md §3.14: "the vocabulary is the design." That applies to
# the numbers as much as to the words, and it is the reason there is no free
# field and no slider anywhere in the playbook. A range would let a player tune
# "paid at least $137" until it fitted last week, which is bookkeeping rather
# than judgement; a closed list of four makes the interesting question *which
# threshold*, and never how precisely one can be named.
#
# Each list is shared across the questions that need it, so "their Karma is
# above 200" reads the same way whoever is asking. What crosses the wire is only
# `says` — the amount below it is what a matcher (#19) compares against, and the
# client is never handed a number it could do arithmetic with (§10.2).
#
# `compare` is how the amount is meant, and it belongs to the list rather than to
# the term because the word is already in the sentence: a list whose options all
# begin "above" is a floor, and one whose options begin "under" is a ceiling.
#
#   at-least   the reading has to be this or more
#   at-most    the reading has to be this or less
#   quantity   not a test at all — an amount an action hands over

- key: fee
  label: paid at least
  unit: cents
  compare: at-least
  options:
    - { key: low, says: "above $20", amount: 2000 }
    - { key: fair, says: "above $60", amount: 6000 }
    - { key: good, says: "above $150", amount: 15000 }
    - { key: serious, says: "above $400", amount: 40000 }

- key: karma
  label: their standing
  unit: karma
  compare: at-least
  options:
    - { key: any, says: "above 50", amount: 50 }
    - { key: known, says: "above 200", amount: 200 }
    - { key: respected, says: "above 800", amount: 800 }
    - { key: notable, says: "above 2,000", amount: 2000 }

- key: hours
  label: how long it takes
  unit: minutes
  compare: at-most
  options:
    - { key: brief, says: "under 1 hour", amount: 60 }
    - { key: short, says: "under 2 hours", amount: 120 }
    - { key: half-day, says: "under 4 hours", amount: 240 }
    - { key: day, says: "under 8 hours", amount: 480 }

- key: spare
  label: spare in hand
  unit: cents
  compare: at-least
  options:
    - { key: little, says: "over $200", amount: 20000 }
    - { key: some, says: "over $800", amount: 80000 }
    - { key: comfortable, says: "over $2,000", amount: 200000 }

- key: cap
  label: the ceiling
  unit: cents
  compare: quantity
  options:
    - { key: token, says: "up to $10", amount: 1000 }
    - { key: real, says: "up to $40", amount: 4000 }
    - { key: generous, says: "up to $100", amount: 10000 }

# A multiple of the player's own rate, held in hundredths so that the amount is
# an integer like every other one here. 120 is 1.2 times.
- key: rate
  label: multiple of my rate
  unit: percent
  compare: at-least
  options:
    - { key: little-over, says: "1.2 times", amount: 120 }
    - { key: half-again, says: "1.5 times", amount: 150 }
    - { key: double, says: "twice", amount: 200 }
    - { key: triple, says: "three times", amount: 300 }

- key: asked
  label: how often
  unit: times
  compare: at-least
  options:
    - { key: once, says: "once", amount: 1 }
    - { key: twice, says: "twice", amount: 2 }
    - { key: thrice, says: "three times", amount: 3 }
