# The playbook is a small fixed set of questions the world will ask, and
# the answer to each is composed from a closed pool that belongs to *that question*.
#
# So the loop is: answer, walk around for a week, read what happened, answer again.
# Nothing in this file says  which answer suits which place. Working that out is the game.

key: help
ask: Somebody asks you for help with a task. When do you say yes?
note: It happens two or three times a week and you are not there for any of them.
about: someone asks me for help

conditions:
  - { key: fee, says: "they are paying me {value}", values: fee }
  - { key: legal, says: "the task is legal" }
  - { key: short, says: "it takes me {value}", values: hours }
  - { key: useful, says: "they could be useful to me later" }
  - { key: karma, says: "their Karma is {value}", values: karma }
  - { key: friend, says: "they could become a friend" }
  # The three that are about the person rather than about the task: who owes
  # whom, how often they have come to you, and whether you have let them down.
  - { key: owe, says: "I owe them something" }
  - { key: down, says: "I have let them down before" }

# The first action is what an unanswered question opens with, so it is the least
# committal one that is still an answer rather than the most interesting one.
#
# `stance` is what the action *amounts to*, out of a closed set shared by every
# question — and it is the only field here that two questions have in common.
# The matcher (#19) needs it because a moment can put more than one question at
# once: somebody raising their voice while asking you to work late puts `voice`
# and `overtime` together, and the two rules the player wrote then both reach an
# action. "Accept it" and "say yes" are different words for the same posture and
# must not read as a disagreement; "accept it" and "say no" are one, and the
# moment escalates to the player rather than the character picking a side.
actions:
  - { key: "yes", says: "say yes", stance: yield }
  - { key: "no", says: "say no", stance: resist }
  - { key: once, says: "say yes, this once", stance: yield }
  - { key: price, says: "name a price", stance: bargain }
