# A standing question, and the whole vocabulary of answers to it.
#
# The playbook is not a list of rules the player thought of. It is a small fixed
# set of questions the world will definitely ask, and the answer to each is
# composed from a closed pool that belongs to *that question* — which is why the
# conditions live in this file rather than in one global list. "They are paying
# me above $60" is not a thing you can say about somebody raising their voice at
# you, and a shared pool would have to either offer it there or filter it out
# somewhere less honest than here.
#
# None of the answers is correct (§3.15). Each is effective in some environment
# and ruinous in another, and environments drift, so the loop is: answer, walk
# around for a week, read what happened, answer again. Nothing in this file says
# which answer suits which place. Working that out is the game.
#
# `start: true` is the vocabulary a player arrives with. Everything else is
# earned through struggle-gating (§3.6) and is not listed, blanked or hinted at
# until it is — which is why there is no "learn" sentence on a locked term the
# way there is on a locked routine. A routine you cannot configure is a visible
# absence with a reason attached; a term you have not thought of yet is simply
# not a thing you have thought of.

key: help
order: 1
ask: Somebody asks you for help with a task. When do you say yes?
note: It happens two or three times a week and you are not there for any of them.
about: someone asks me for help

conditions:
  - { key: fee, says: "they are paying me {value}", values: fee, start: true }
  - { key: legal, says: "the task is legal", start: true }
  - { key: short, says: "it takes me {value}", values: hours, start: true }
  - { key: useful, says: "they could be useful to me later" }
  - { key: karma, says: "their Karma is {value}", values: karma }
  - { key: friend, says: "they could become a friend" }
  # The three that are about the person rather than about the task. They exist
  # because §3.15's daily conflicts are with the people you live among, and what
  # stands between you and one of them is a fact the world can state — who owes
  # whom, how often they have come to you, and whether you have let them down.
  # Locked, like every other term that is not a first-day word: working out that
  # the answer depends on which of the six is asking is exactly the kind of thing
  # struggle-gating exists to make earned (§3.6).
  - { key: owe, says: "I owe them something" }
  - { key: again, says: "they have asked me {value} this month", values: asked }
  - { key: down, says: "I have let them down before" }

# The first action is what an unanswered question opens with, so it is the least
# committal one that is still an answer rather than the most interesting one.
#
# `stance` is what the action *amounts to*, out of a closed set shared by every
# question — and it is the only field here that two questions have in common.
# The matcher (#19) needs it because a moment can put more than one question at
# once: somebody raising their voice while asking you to work late puts `voice`
# and `overtime` together, and the two rules the player wrote then both reach an
# action. "Accept it" and "say yes" are different words for the same posture and
# must not read as a disagreement; "accept it" and "say no" are one, and the
# moment escalates to the player rather than the character picking a side.
actions:
  - { key: "yes", says: "say yes", stance: yield, start: true }
  - { key: "no", says: "say no", stance: resist, start: true }
  - { key: once, says: "say yes, this once", stance: yield }
  - { key: price, says: "name a price", stance: bargain }
