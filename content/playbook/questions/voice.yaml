# Note that this question has a condition called `leave` and an action called
# `leave`, and they are different terms. Keys are scoped to a pool inside a
# question, which is the same reason the pools are scoped to a question at all:
# "I could walk out of the room" and "leave the situation" are a fact and a
# decision, and nothing good comes of a vocabulary that cannot tell them apart.

key: voice
order: 2
ask: Somebody raises their voice at you. What do you do?
note: Whatever you pick, you will have done it eleven times before you read about it.
about: someone raises their voice at me

conditions:
  - { key: above, says: "they are above me at work", start: true }
  - { key: watching, says: "other people are watching", start: true }
  - { key: before, says: "they have done this to me before", start: true }
  - { key: karma, says: "their Karma is {value}", values: karma }
  - { key: leave, says: "I could walk out of the room" }
  - { key: owe, says: "I owe them something" }
  # The one a daily conflict brings (§3.15). Somebody raising it again is a
  # different moment from somebody raising it, and a player who cannot say so
  # cannot write a rule that tells the two apart.
  - { key: unsettled, says: "we left something unfinished" }

actions:
  - { key: finish, says: "let them finish", stance: yield, start: true }
  - { key: quiet, says: "stay quiet", stance: yield, start: true }
  - { key: back, says: "raise my voice back", stance: resist, start: true }
  - { key: feel, says: "ask them how they feel", stance: open }
  - { key: leave, says: "leave the situation", stance: withdraw }
