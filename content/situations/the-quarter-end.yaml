# Tier four again, and the other half of what §3.14 means by multi-week
# consequences: the number at the end of the quarter, and the fact that it is the
# only thing anybody will remember.

key: the-quarter-end
roles:
  - partner-track
  - regional
name: The quarter end

line: >-
  You are eleven days out and about four points short, and Hollis from the
  Carrow site has found the eleven days in a maintenance line that was going to
  be spent in March anyway. He is not asking you to approve it. He is telling
  you he has found it, in a way that is asking you to approve it.

puts: [help, money]

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/useful, so: true }
  - { term: help/condition/short, reading: 30 }
  - { term: money/condition/spare, reading: 300000 }
  - { term: money/condition/repaid, so: false }
  - { term: money/condition/public, so: false }

answers:
  - stance: yield
    did: >-
      Let it move, and make the number.
    came: >-
      You make the number by a point and a half and nobody asks a single
      question about it. In March the maintenance is not done, because in March
      there is a different number eleven days out. The line is moved again the
      quarter after that.
    title: "You let Hollis move the maintenance line"
    outcome: poor
    moves:
      intelligence: -6
      stability: -16
      kindness: -8

  - stance: defer
    did: >-
      Leave it where it is until you have seen the whole line.
    came: >-
      You look. Two thirds of it is genuinely deferrable and one third is a
      conveyor at Carrow that has been on a watch list since August. You move
      the two thirds and you write down, in an email you send to yourself, what
      the other third is and why it stayed. You come in a point short.
    title: "You held Hollis off until you had seen the whole line"
    outcome: good
    moves:
      intelligence: 30
      stability: 14

  - stance: bargain
    did: >-
      Move it, if the March line is protected in writing.
    came: >-
      The writing takes four days and comes back with a clause in it you did not
      ask for. The number lands. In March the line is protected and the clause
      means Carrow is the site that carries the cost of protecting it.
    title: "You moved the line with March protected in writing"
    outcome: mixed
    moves:
      intelligence: 16
      kindness: -12

  - stance: resist
    did: >-
      Tell him no and come in short.
    came: >-
      You come in four points short and the quarter is a bad quarter, said out
      loud, in a room, with your name attached to it. The maintenance happens in
      March. In June somebody from Carrow tells you the conveyor would have
      gone.
    title: "You told Hollis no and came in short"
    outcome: mixed
    moves:
      intelligence: 12
      stability: -14
      kindness: 10
