# The cause argued from the playbook's own log rather than from the body, and
# the only one whose evidence is about what the player *meant* to do.
#
# §3.4 puts organization last of the four routines because it is "the one that
# decides how much of the other three actually happens", and the evidence for it
# has the same shape: not a reading that went the wrong way, but a count of
# moments that arrived with nothing arranged to meet them.

says: Nothing about my week was arranged, so everything in it was decided on the spot.

because: >-
  Things kept arriving and I kept answering them one at a time. That is not a
  run of bad luck, it is the absence of a plan showing up as one.

speaks-from:
  - playbook/nothing-covered-it
  - playbook/answers-disagreed
  - health/short-nights

unlocks:
  routine: organization
  terms:
    - help/action/once
    - help/condition/useful
