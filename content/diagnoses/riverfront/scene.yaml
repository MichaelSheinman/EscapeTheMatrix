# The riverfront stages the same conversation with Rhodes, and it is a different
# conversation.
#
# §3.15's rule for authoring across two populations applies here exactly as it
# does to a daily conflict: same mechanic, same four lines, and the people are
# not interchangeable. Deshaun waits. Rhodes has already decided what he thinks
# and is waiting to see whether you say it first — and will mention, six weeks
# from now, that he was there when you worked it out.
#
# What neither of them does is tell you. The population changes the register of
# the room and never the rule (§3.6, rule 2): a place where everything is a
# trade still cannot sell you the answer, because the answer is not a thing the
# game has.

who: rhodes

opens: >-
  He racks the weight, sits on the end of the bench, and looks at you for
  slightly too long before he says anything at all.

asks: >-
  Go on then. You have been off for a month and you know why. What is it.

weighs: >-
  He hears you out without interrupting, which from him is not politeness. It
  is him deciding whether you have worked it out or are still guessing.

closes: >-
  Fine. That is your read. Run it for a few weeks and we will both find out
  whether it was, and I will not have to say anything either way.
