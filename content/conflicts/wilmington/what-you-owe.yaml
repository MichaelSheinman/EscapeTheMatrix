  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 180 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/friend, so: true }

answers:
  - stance: yield
    did: "Turned up Saturday morning, sleeves rolled."
    came: >-
      I saw you get off the bus with them bags and no, don't argue, they're
      going up to your door. After Saturday you're carrying nothing for a
      month.
    title: "You turned up Saturday for {who}'s move"
    outcome: good
    moves: { kindness: 12, stability: 6 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "I'm in Saturday — just cover my gas for the dump runs."
    came: >-
      There's your $20 for the dump runs, take it. Thank you for Saturday,
      much appreciated.
    title: "You did {who}'s move for the gas money"
    outcome: mixed
    moves: { intelligence: 8, kindness: -8 }
    shifts: { owed: 1 }

  - stance: resist
    did: "Made sure it got around: you're busy Saturday."
    came: >-
      All done. Three of us instead of four, so it took till dark and my sister's
      back's in bits, but we got there without troubling anybody who was busy.
    title: "You put the word out that you were busy for {who}"
    outcome: poor
    moves: { kindness: -14, stability: -4 }
    shifts: { slighted: 1 }
