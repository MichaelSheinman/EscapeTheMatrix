key: left-my-wallet
among: wilmington
with: [kyle]
every: 30
follows: easy
name: "Asking you to cover his shop bill"

line: >-
  Left my wallet at the office. Can you get this? It's fourteen dollars and
  change, and I bill four hundred an hour, so going back for it costs more than
  what's on the counter.

puts: money

facts:
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: false }
  - { term: money/condition/public, so: true }

raises: { asked: 1 }

answers:
  # Covering him is the expensive answer, and the cost is judgement rather than
  # kindness: the money is nothing and the man asking has more of it than
  # anybody in Wilmington.
  - stance: yield
    did: "Sure, I've got it."
    came: >-
      Good call. That's the right read on the numbers. I'll get you back next
      time I'm in there.
    title: "You covered {who}'s $14 at the shop"
    outcome: poor
    moves: { intelligence: -12, stability: -2 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Let me think about it."
    came: >-
      Think about it. Fourteen dollars. Bez is standing here holding the
      sandwich while you think about it. A no would at least be an answer.
    title: "You told {who} you'd think about the $14"
    outcome: mixed
    moves: { intelligence: 2, stability: -2 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: "I'll cover it. You pay me back Friday."
    came: >-
      Friday is fine, though that's a lot of process for fourteen dollars. I
      move six figures before lunch with less paperwork than this.
    title: "You covered {who}'s $14 and set a payback day"
    outcome: mixed
    moves: { intelligence: 6 }
    shifts: { owed: 1 }

  # Refusing costs no kindness here, which is the one place in this population
  # where that is true.
  - stance: resist
    did: "No. Go get your wallet."
    came: >-
      So I drive to the office and back over fourteen dollars. Bez is standing
      here holding my sandwich.
    title: "You refused {who} at the shop counter"
    outcome: good
    moves: { intelligence: 10, stability: 4 }
