# The understated ask; walking away clean is not clean here.

key: the-quick-hand
among: wilmington
with: [sharon-daly]
after:
  - name-behind-it
follows: easy
name: "The quick hand with the boxes"

line:
  - >-
    You about Saturday morning? Could use a quick hand getting boxes down to my
    brother's van — we've got to be out by Sunday so it's all going at once, but
    honestly, twenty minutes and you're done. Bacon rolls on me.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 60 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/down, from: slighted }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Yeah, I'm around Saturday. Knock when you're ready."
    came:
      - >-
        Four o'clock! Twenty minutes I said, didn't I. That washer on your own
        though — I've told everyone on the landing and they don't believe me.
    title: "You said you were free Saturday for {who}'s boxes"
    outcome: mixed
    moves: { kindness: 8, stability: -6 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "How many boxes are we talking? A trip or a whole van load?"
    came:
      - >-
        Alright, fair play — it's three floors, no lift, and the sofa and the
        washer are in it too. You take the morning and I'll put my brother on
        the afternoon.
    title: "You asked {who} how many boxes there were"
    outcome: mixed
    moves: { intelligence: 10, kindness: -4 }

  - stance: resist
    did: "Can't Saturday, I've got my own stuff on. Sorry."
    came:
      - >-
        No worries at all. Ran into Sunday night in the finish, me and my
        brother and a lad off the corner. You were the first one I asked, mind.
        I'll remember it.
    title: "You turned down {who}'s Saturday boxes"
    outcome: poor
    moves: { kindness: -10 }
    shifts: { slighted: 1 }
