key: nobody-mentioned-it
among: wilmington
with: [sarah]
follows: slighted
name: "Overheard retelling of the missed delivery"

line: >-
  So I'd asked about the Tuesday, the fridge delivery, and got told yes, no
  bother. Come Tuesday there's no answer at the door, and the van took it back
  to the depot. Got it the week after in the end.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "I never meant anything by it, you know that."
    came: >-
      It's done, forget it. Anyway — did I tell you the van took that fridge
      the whole way back to the depot? Week I sat waiting on it.
    title: "You told {who} you meant nothing by the Tuesday"
    outcome: mixed
    moves: { kindness: 6, stability: 8, intelligence: -4 }

  - stance: open
    did: "That week without the fridge — how bad was it? Tell me straight."
    came: >-
      Bad enough. Tinned stuff all week and a chip shop bill I could've done
      without. There, said it. Kettle's on if you're passing, boiler's the
      next saga.
    title: "You asked {who} about the week without the fridge"
    outcome: good
    moves: { kindness: 18, intelligence: 14, stability: 6 }
    shifts: { slighted: -1 }

  - stance: resist
    did: "That's not how it went. I said Wednesday, not Tuesday."
    came: >-
      There's two versions of that fridge going round now and people are
      stopping me to ask which one they're getting. Wednesday, was it.
    title: "You told {who} you had said Wednesday"
    outcome: poor
    moves: { stability: -12, kindness: -10 }
    shifts: { slighted: 1, unsettled: 1 }

  - stance: withdraw
    did: "Kept walking to the stairs."
    came: >-
      I finished the telling without you. Half the do had it back at me by the
      end of the night off people who weren't even there — you heard them.
    title: "You walked away from {who}'s account of the Tuesday"
    outcome: poor
    moves: { stability: 4, kindness: -14 }
    shifts: { unsettled: 1 }
