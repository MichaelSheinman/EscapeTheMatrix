key: the-tenner
among: wilmington
# Everybody but Bez, and the exception is the content rather than an oversight:
# this happens at the corner shop counter, Bez is behind it six days out of
# seven, and the replies below are about the man serving. He cannot be both.
with: [deshaun, sharon-daly, leanne]
every: 30
follows: easy
name: "$12 short at the till"

line: >-
  Oh God — I'm $12 short, the card's not gone through. It's just the bread and
  the mince. Could you see me right and I'll square it Friday?

puts: money

facts:
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: true }
  - { term: money/condition/public, so: true }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Covered it at the till."
    came: >-
      Thanks for that — Bez had the bag packed and half the block stood behind
      us in the queue, so you spared me a right show. I'll square it Friday,
      I've not forgotten.
    title: "You covered {who}'s $12 at the till"
    outcome: good
    moves: { kindness: 12, stability: 4 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Patted pockets and said hang on."
    came: >-
      Bez had it in his book before either of us got a word out, so it's down
      against my name now. Don't be worrying about it — we're grand.
    title: "You patted your pockets and told {who} to hang on"
    outcome: mixed
    moves: { stability: -4, kindness: -6 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: "I've got it — Friday, yeah? When you're paid."
    came: >-
      That'll be my envelope through your door at teatime. $12, all of it,
      Friday like I said.
    title: "You covered {who}'s $12 against Friday"
    outcome: mixed
    moves: { intelligence: 8, kindness: -6 }

  - stance: resist
    did: "Sorry — I can't today."
    came: >-
      Bez put his own hand in his pocket for it, rang it through and handed me
      the bag without a word. Thought you'd want to know.
    title: "You did not cover {who}'s $12"
    outcome: poor
    moves: { kindness: -12 }
    shifts: { slighted: 1 }
