# Money, asked for the way it is asked for here: as a trade, with the terms
# stated first and the friendliness applied afterwards.

key: the-round-number
among: the-lifts
follows: easy
name: A round number, over coffee

line: >-
  {who} needs a round number for eight weeks and says so in one sentence, then
  waits, and watches which way you fill the silence.

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: true }
  - { term: money/condition/public, so: false }
  - { term: money/condition/spare, reading: 300000 }

raises: { asked: 1 }

answers:
  - stance: yield
    did: Hand it over on the terms offered.
    came: >-
      It comes back in eight weeks to the day, which is the last thing about it
      that goes your way. The next ask is larger and arrives sooner.
    outcome: mixed
    moves: { kindness: 8, intelligence: -6 }
    shifts: { owed: 1 }

  - stance: defer
    did: Say you will think about it.
    came: >-
      {who} says of course and has it arranged elsewhere by Thursday. The
      thinking-about-it is remembered longer than the money would have been.
    outcome: poor
    moves: { stability: -4, intelligence: -4 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: Name a rate and a date.
    came: >-
      Both are agreed inside a minute and written down inside a day. It comes
      back with the rate attached and the next conversation starts from there.
    outcome: good
    moves: { intelligence: 16, stability: 8 }
    shifts: { owed: 1 }

  - stance: resist
    did: Say no, plainly.
    came: >-
      {who} nods and moves straight to what they were going to say next. Nothing
      is different at eight the following morning.
    outcome: mixed
    moves: { stability: 8, kindness: -6 }
