# What comes back when something is left open here: not louder, but with an
# audience assembled for it.

key: the-open-item
among: the-lifts
follows: unsettled
name: Raised with the room

line: >-
  {who} brings up the thing the two of you never closed, in front of three
  people, in the tone somebody uses for an item on a list rather than a
  grievance.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: Concede it and move on.
    came: >-
      It closes in under a minute and the room moves on with you. The next three
      things that need deciding are decided without your view being asked for.
    outcome: poor
    moves: { kindness: 6, stability: 4, intelligence: -12 }
    shifts: { unsettled: -1 }

  - stance: open
    did: Ask, in front of everybody, what closing it would look like.
    came: >-
      {who} has to say what they want out loud, with three people listening, and
      it turns out to be smaller than the way it was raised. It closes on your
      terms because they are the only terms anybody stated.
    outcome: good
    moves: { intelligence: 18, stability: 12 }
    shifts: { unsettled: -1 }

  - stance: resist
    did: Say it was closed in March.
    came: >-
      The room now has two accounts of March and no way to choose between them.
      Both of you are asked about it separately over the following week.
    outcome: mixed
    moves: { stability: -6, intelligence: 4 }
    shifts: { unsettled: 1 }

  - stance: withdraw
    did: Say you will pick it up another time, and go.
    came: >-
      The other time does not arrive. What does arrive is the item, on somebody
      else's list, with a version of your position already written into it.
    outcome: poor
    moves: { stability: 4, intelligence: -14 }
    shifts: { unsettled: 1 }
