# The collection, on a landing where nobody collects.
#
# It follows from a debt the player actually incurred, and the debt is what makes
# the ask land differently — which is why `owe` is read off the ledger here
# rather than written into the file.

key: what-you-owe
among: the-landing
follows: owing
name: The thing you were going to do anyway

line: >-
  {who} mentions, on the way past and not to you exactly, that the van is booked
  for Saturday and there is a wardrobe in it that two people cannot carry. You
  are one of the two people who has not been asked.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 180 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/again, from: asked }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/friend, so: true }

answers:
  - stance: yield
    did: Turn up on Saturday.
    came: >-
      It takes the whole morning and most of the afternoon and nobody mentions
      what it was for. On Monday your recycling is out on the kerb and you did
      not put it there.
    outcome: good
    moves: { kindness: 12, stability: 6 }
    shifts: { owed: 1 }

  - stance: bargain
    did: Say yes if {who} covers the fuel.
    came: >-
      The fuel is covered without a word of argument and the wardrobe still gets
      carried. Something about the morning is quieter than it would have been,
      and neither of you says what.
    outcome: mixed
    moves: { intelligence: 8, kindness: -8 }
    shifts: { owed: 1 }

  - stance: resist
    did: Say you are busy on Saturday.
    came: >-
      {who} says of course, immediately, and finds somebody on the second floor
      instead. What you owed is still owed and now there is a Saturday attached
      to it that everybody was there for.
    outcome: poor
    moves: { kindness: -14, stability: -4 }
    shifts: { slighted: 1 }
