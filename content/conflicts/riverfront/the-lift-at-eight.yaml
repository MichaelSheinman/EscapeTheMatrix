key: the-lift-at-eight
among: riverfront
follows: easy
name: "A compliment in the lift, angled down"

line: >-
  Saw the Fenwick report — genuinely solid work. You can really see how much
  the template carried it. Nice to have that kind of scaffolding, isn't it?

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: false }

answers:
  - stance: yield
    did: "Thanks — glad it landed."
    came: >-
      By Thursday the version going round the floor was that the Fenwick
      report "basically wrote itself". It reached you from someone who hadn't
      been in the lift.
    outcome: poor
    moves: { kindness: 6, intelligence: -10 }

  - stance: open
    did: "What do you mean by carried?"
    came: >-
      {who} waved it off as a joke. The other two studied the floor indicator,
      and one of them later asked, kindly, whether everything was all right
      with the report.
    outcome: poor
    moves: { kindness: 6, stability: -10, intelligence: -6 }

  - stance: resist
    did: "The template was two headings. The modelling is mine, from scratch."
    came: >-
      {who} said "sure, of course" and went quiet. One of the other two
      emailed that afternoon asking if you'd look at their modelling; {who}
      has kept to the weather since.
    outcome: mixed
    moves: { stability: 8, intelligence: 8, kindness: -10 }

  - stance: withdraw
    did: "I stepped off at three and took the stairs."
    came: >-
      The doors closed on the conversation mid-sentence and it carried on to
      the eighth floor without you. What was said in the last five floors
      reached you secondhand, days later.
    outcome: poor
    moves: { stability: -6, intelligence: -8 }
    shifts: { unsettled: 1 }
