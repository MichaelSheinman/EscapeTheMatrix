key: the-open-item
among: riverfront
follows: unsettled
name: "A settled matter reopened at the table"

line: >-
  While we're all here — the question of the Danvers allocation is still open
  between us, and I'd rather we resolve it properly than let it drift. Shall
  we put it on the table?

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "Fine — let's do it your way and close it."
    came: >-
      The item closed on {who}'s terms in under a minute. The next round of
      allocation decisions was made in a meeting you weren't invited to, and
      you read about it in the minutes.
    outcome: poor
    moves: { kindness: 6, stability: 4, intelligence: -12 }
    shifts: { unsettled: -1 }

  - stance: open
    did: "Say exactly what you want changed — here, now."
    came: >-
      Asked to name it in the room, {who} asked for a fraction of what had
      been implied. It closed on your terms and the three colleagues moved to
      the next item.
    outcome: good
    moves: { intelligence: 18, stability: 12 }
    shifts: { unsettled: -1 }

  - stance: resist
    did: "That was settled in April. It's not an open item."
    came: >-
      Two accounts of the Danvers matter now circulate. Each of you has since
      been taken aside separately and asked what actually happened.
    outcome: mixed
    moves: { stability: -6, intelligence: 4 }
    shifts: { unsettled: 1 }

  - stance: withdraw
    did: "Let's take this offline — it's not one for the room."
    came: >-
      It was decided that week in a meeting you weren't at. The summary of
      your position read into that meeting was written by {who}.
    outcome: poor
    moves: { stability: 4, intelligence: -14 }
    shifts: { unsettled: 1 }
