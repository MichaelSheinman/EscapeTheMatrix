key: the-open-item
among: riverfront
with: [alina-voss, corinne, petra-sandoval]
follows: unsettled
name: "A settled matter reopened at the table"

line: >-
  While we're all here — the question of the Danvers allocation is still open
  between us, and I'd rather we resolve it properly than let it drift. Shall
  we put it on the table?

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "Fine — let's do it your way and close it."
    came: >-
      Good, that's Danvers closed and closed properly. The next allocation
      round was settled Tuesday, minutes went round Wednesday.
    outcome: poor
    moves: { kindness: 6, stability: 4, intelligence: -12 }
    shifts: { unsettled: -1 }

  - stance: open
    did: "Say exactly what you want changed — here, now."
    came: >-
      You had me there. What I actually wanted was a good deal smaller than it
      sounded across the table. Closed your way, and I'd rather have it
      closed.
    outcome: good
    moves: { intelligence: 18, stability: 12 }
    shifts: { unsettled: -1 }

  - stance: resist
    did: "That was settled in April. It's not an open item."
    came: >-
      I've been pulled aside about Danvers twice this week and I assume you
      have as well. We are plainly not describing the same thing.
    outcome: mixed
    moves: { stability: -6, intelligence: 4 }
    shifts: { unsettled: 1 }

  - stance: withdraw
    did: "Let's take this offline — it's not one for the room."
    came: >-
      Danvers went through Thursday. Small room, so I put your position into
      it myself — I'll send you what I said, if you want it.
    outcome: poor
    moves: { stability: 4, intelligence: -14 }
    shifts: { unsettled: 1 }
