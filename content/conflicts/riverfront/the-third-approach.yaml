key: the-third-approach
among: riverfront
follows: asking
name: "A third free twenty minutes this month"

line: >-
  Me again — I know, third time this month. Could I grab twenty minutes on the
  licensing question before Friday? Same as before, just need your read on it
  — you're so quick at these.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 30 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/again, from: asked }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/useful, so: true }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Go on then — Thursday at four."
    came: >-
      Thursday's twenty minutes ended at ten to five. The following Tuesday a
      fourth request arrived, worded the same way as the first three.
    outcome: poor
    moves: { kindness: 8, intelligence: -12, stability: -4 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "Happy to help — after this one it's my rate, $150 an hour."
    came: >-
      "Completely fair" came back straight away. The next request, a fortnight
      later, opened with a budget line and a purchase order number.
    outcome: good
    moves: { intelligence: 18, stability: 12, kindness: -4 }

  - stance: resist
    did: "Not this time — I can't keep doing these free."
    came: >-
      By that evening {who} had the answer from someone else and said so
      cheerfully in the lobby. The tone between you didn't change.
    outcome: mixed
    moves: { stability: 8, kindness: -6 }
