key: the-quiet-part
among: riverfront
follows: easy
name: "An hour's favor, half the story told"

line: >-
  Small one — could you give the Arden filing a quick once-over before Friday?
  An hour, tops. It's in great shape, honestly, just needs a second pair of
  eyes before it goes in.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 60 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/again, from: asked }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/useful, so: true }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Sure — send it over, I'll look tonight."
    came: >-
      It's through. Sorry about the dispute buried in there — I'd not have
      blamed you for stopping at the hour. Thanks have been coming my way all
      morning, which I'm taking on your behalf.
    outcome: poor
    moves: { kindness: 8, intelligence: -14 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "Before I say yes — what's the full situation with it?"
    came: >-
      Full picture: there's a challenge already lodged and the real date is
      Wednesday, not Friday. Section 4 only, then, and I'll hold it to that.
    outcome: good
    moves: { intelligence: 16, stability: 10 }

  - stance: resist
    did: "Can't take it on this week — sorry."
    came: >-
      Arden got bounced, publicly, and it was that challenge sat at the middle
      of it. Your name isn't anywhere near the thing, which is more than I can
      say for mine.
    outcome: good
    moves: { stability: 14, intelligence: 10, kindness: -6 }
