key: the-name-on-it
among: riverfront
follows: asking
name: "Your name wanted on a $500 stake"

line: >-
  It's a $500 stake, purely nominal — what we actually need is your name on
  the backer list. Investors read it and relax. You'd do nothing, we do all
  the work — can I pencil you in?

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: false }
  - { term: money/condition/public, so: true }
  - { term: money/condition/spare, reading: 200000 }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Fine — put me down for the $500."
    came: >-
      The prospectus went out that week with your name leading the backer
      page, set larger than the others. All questions about the actual work go
      to {who}.
    outcome: poor
    moves: { kindness: 6, intelligence: -14, stability: -6 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Send me the terms in writing first — then I'll look."
    came: >-
      The document arrived two days later with an observer seat and a buyback
      clause that hadn't been mentioned by text. {who} called it "the standard
      version".
    outcome: good
    moves: { intelligence: 14, stability: 8 }

  - stance: bargain
    did: "My name isn't $500. Make it 2% advisory equity and we can talk."
    came: >-
      Accepted inside the hour, no counter. The paperwork arrived the same
      afternoon, already signed on their side.
    outcome: good
    moves: { intelligence: 18, stability: 10, kindness: -4 }

  - stance: resist
    did: "I'll pass — keep my name off the materials."
    came: >-
      The venture launched anyway. Twice in the following month, people asked
      you directly whether you were involved, having assumed you were.
    outcome: mixed
    moves: { stability: 8, kindness: -8, intelligence: 6 }
