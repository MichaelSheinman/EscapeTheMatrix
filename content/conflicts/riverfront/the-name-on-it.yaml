key: the-name-on-it
among: riverfront
with: [petra-sandoval]
follows: asking
name: "Your name wanted on a $500 stake"

line: >-
  It's a $500 stake, purely nominal — what we actually need is your name on
  the backer list. Investors read it and relax. You'd do nothing, we do all
  the work — can I pencil you in?

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: false }
  - { term: money/condition/public, so: true }
  - { term: money/condition/spare, reading: 200000 }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Fine — put me down for the $500."
    came: >-
      Prospectus went out Tuesday. You're leading the backer page and set a
      size larger than the rest, which I hope you'll forgive. Anything
      technical comes to me.
    outcome: poor
    moves: { kindness: 6, intelligence: -14, stability: -6 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Send me the terms in writing first — then I'll look."
    came: >-
      Terms attached. There's an observer seat and a buyback clause in there —
      that's just our standard version, nothing out of the ordinary.
    outcome: good
    moves: { intelligence: 14, stability: 8 }

  - stance: bargain
    did: "My name isn't $500. Make it 2% advisory equity and we can talk."
    came: >-
      I'm not going to haggle with you over 2%. Papers reach you this
      afternoon with my signature already on them.
    outcome: good
    moves: { intelligence: 18, stability: 10, kindness: -4 }

  - stance: resist
    did: "I'll pass — keep my name off the materials."
    came: >-
      Your name is nowhere on the materials, as asked. Two people this month
      have assumed otherwise and asked me directly — I sent them to you.
    outcome: mixed
    moves: { stability: 8, kindness: -8, intelligence: 6 }
