# Somebody who owes you, asking anyway — the mirror of the landing's version.
# Here saying the balance out loud is the competent move rather than the rude
# one, which is the whole of §3.15 in two files.

key: the-introduction
among: riverfront
follows: owed
name: Calling it in, backwards

line: >-
  {who} needs two hours of your time this week and asks for it as though the
  introduction they made you in the spring is still working in their favour
  rather than yours.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 120 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/useful, so: true }

answers:
  - stance: yield
    did: Do it, and let the spring go.
    came: >-
      The two hours turn into three and are used well. By the summer the version
      of the spring that gets repeated in the lift is the one where you were the
      one being done a favour.
    outcome: poor
    moves: { kindness: 10, intelligence: -10 }
    shifts: { owed: -1 }

  - stance: bargain
    did: Say yes, and say what the spring was worth.
    came: >-
      {who} laughs, once, and agrees to all of it. The arrangement holds and so
      does the account of the spring.
    outcome: good
    moves: { intelligence: 16, stability: 10 }

  - stance: resist
    did: Say no, and leave the spring where it is.
    came: >-
      There is no argument and no visible reaction. The next introduction goes to
      somebody else and you hear about it from a third person.
    outcome: mixed
    moves: { stability: 6, kindness: -8 }
