key: the-introduction
among: riverfront
with: [rhodes]
follows: owed
name: "Two hours asked, the favor inverted"

line: >-
  Could you give me two hours Thursday on the Halloran deck? After everything
  I've set up for you this year, it'd be good to see some of it come back this
  way. Morning works best.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 120 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/useful, so: true }

answers:
  - stance: yield
    did: "Send over the deck — I'll take Thursday morning."
    came: >-
      Thursday was useful, thank you. And glad the Meyer introduction came
      good for you in the end — I'd always hoped that one would pay you back.
    outcome: poor
    moves: { kindness: 10, intelligence: -10 }
    shifts: { owed: -1 }

  - stance: bargain
    did: "Happy to — funny, since I made the Meyer intro. Thursday morning?"
    came: >-
      You made Meyer, I'd genuinely forgotten that. Two hours well spent this
      morning, and I've been telling it with both halves in ever since.
    outcome: good
    moves: { intelligence: 16, stability: 10 }

  - stance: resist
    did: "Can't spare it this month — good luck with it."
    came: >-
      Halloran will survive without me. Drinks on the 14th are just that crowd
      this quarter — back to the usual list next time, I'd expect.
    outcome: mixed
    moves: { stability: 6, kindness: -8 }
