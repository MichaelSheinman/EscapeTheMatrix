key: the-short-answer
among: riverfront
follows: slighted
name: "One-word answers where help used to be"

line: >-
  It's in the Q2 folder somewhere. I don't have time to walk you through it
  these days.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: false }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "Thanks — I'll dig it out."
    came: >-
      You found it yourself in twenty minutes. The answers since have stayed
      exactly that length: correct, minimal, and nothing more.
    outcome: mixed
    moves: { stability: 6, kindness: -4 }

  - stance: open
    did: "Have I put you out somehow? You seem short with me."
    came: >-
      {who} named it in one message — the February ask you'd waved off — and
      left it there. The next work question got a proper answer, with the old
      detail back in it.
    outcome: good
    moves: { intelligence: 14, kindness: 10 }
    shifts: { slighted: -1 }

  - stance: resist
    did: "This is getting unprofessional. We work in the same building."
    came: >-
      No reply came. The next question you sent sat unanswered for two days,
      then came back as a link with no message attached.
    outcome: poor
    moves: { stability: -8, kindness: -10 }
    shifts: { slighted: 1 }

  - stance: withdraw
    did: "I asked someone on four instead and stopped sending questions."
    came: >-
      The weekly heads-up {who} used to send before filings stopped,
      unannounced. You missed a deadline change in May and heard about it a
      day late.
    outcome: poor
    moves: { intelligence: -10, kindness: -6 }
    shifts: { unsettled: 1 }
