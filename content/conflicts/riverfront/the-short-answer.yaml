key: the-short-answer
among: riverfront
follows: slighted
name: "One-word answers where help used to be"

line: >-
  It's in the Q2 folder somewhere. I don't have time to walk you through it
  these days.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: false }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "Thanks — I'll dig it out."
    came: >-
      Fine. Second half of that folder, if you're still looking.
    outcome: mixed
    moves: { stability: 6, kindness: -4 }

  - stance: open
    did: "Have I put you out somehow? You seem short with me."
    came: >-
      February. I asked you for something and you waved it off. That's the
      whole of it. Ask me that Q2 question again and you'll get a proper
      answer.
    outcome: good
    moves: { intelligence: 14, kindness: 10 }
    shifts: { slighted: -1 }

  - stance: resist
    did: "This is getting unprofessional. We work in the same building."
    came: >-
      Q2 > filings > tab 3. Anything further, put it in an email and I'll get
      to it when I can.
    outcome: poor
    moves: { stability: -8, kindness: -10 }
    shifts: { slighted: 1 }

  - stance: withdraw
    did: "I asked someone on four instead and stopped sending questions."
    came: >-
      Assumed the fourth floor were keeping you current these days. Bad luck
      with the May date — it moved very quietly, that one.
    outcome: poor
    moves: { intelligence: -10, kindness: -6 }
    shifts: { unsettled: 1 }
