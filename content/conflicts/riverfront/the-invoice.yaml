key: the-invoice
among: riverfront
follows: owing
name: "A March favor gets a $900 price"

line: >-
  You'll remember I sorted your permit issue with the council back in March —
  that's a $900 job at market rate and I never billed it. Fair's fair. Happy
  to take a transfer whenever suits.

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: false }
  - { term: money/condition/public, so: false }
  - { term: money/condition/spare, reading: 120000 }

answers:
  - stance: yield
    did: "Fair enough — sending the $900 today."
    came: >-
      {who} thanked you within the hour. By the following week two neighbours
      mentioned, separately, that you're known as someone who settles without
      questions.
    outcome: mixed
    moves: { kindness: 4, stability: -6, intelligence: -4 }
    shifts: { owed: 1, unsettled: -1 }

  - stance: defer
    did: "Leave it with me — I'll look at it this week."
    came: >-
      On Wednesday the same figure arrived again, this time itemised, with a
      due date at the bottom.
    outcome: poor
    moves: { stability: -8 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: "I didn't order it, but the work was real. I can do $400."
    came: >-
      {who} replied inside three minutes: done, and thanks. No further mention
      of market rate.
    outcome: good
    moves: { intelligence: 18, stability: 10, kindness: -4 }

  - stance: resist
    did: "I never asked for that work, and I won't be paying for it."
    came: >-
      A polite "understood, no hard feelings" came back. The small things
      {who} used to do unasked — the post, the parcel signatures — stopped
      that week.
    outcome: mixed
    moves: { stability: 8, kindness: -8 }
    shifts: { slighted: 1 }
