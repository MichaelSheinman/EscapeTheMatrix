key: the-invoice
among: riverfront
with: [alina-voss]
follows: owing
name: "A March favor gets a $900 price"

line: >-
  You'll remember I sorted your permit issue with the council back in March —
  that's a $900 job at market rate and I never billed it. Fair's fair. Happy
  to take a transfer whenever suits.

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: false }
  - { term: money/condition/public, so: false }
  - { term: money/condition/spare, reading: 120000 }

answers:
  - stance: yield
    did: "Fair enough — sending the $900 today."
    came: >-
      Received, and quicker than I expected. I've mentioned to a couple of
      people how straightforward you are to settle with. Not everyone is.
    outcome: mixed
    moves: { kindness: 4, stability: -6, intelligence: -4 }
    shifts: { owed: 1, unsettled: -1 }

  - stance: defer
    did: "Leave it with me — I'll look at it this week."
    came: >-
      Of course, take your time. I've put it into a proper invoice so it's
      easier to look at — same $900, itemised, dated the 30th at the foot.
    outcome: poor
    moves: { stability: -8 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: "I didn't order it, but the work was real. I can do $400."
    came: >-
      I'll take the $400 and be glad of it. Market rate won't come up again
      from me, that's the end of it.
    outcome: good
    moves: { intelligence: 18, stability: 10, kindness: -4 }

  - stance: resist
    did: "I never asked for that work, and I won't be paying for it."
    came: >-
      That's your position and I'll leave it there. There's a parcel of yours
      sat at reception, incidentally — they'll want you to sign for it
      yourself.
    outcome: mixed
    moves: { stability: 8, kindness: -8 }
    shifts: { slighted: 1 }
