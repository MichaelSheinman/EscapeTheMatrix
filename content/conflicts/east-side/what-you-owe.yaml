key: what-you-owe
among: east-side
follows: owing
name: "Overheard: Saturday's move needs hands"

line: >-
  I've got the whole flat to shift Saturday and it's looking like just me and
  our Karen. Be all day at that rate. Ah well — you find out who's about when
  there's lifting, don't you.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 180 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/again, from: asked }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/friend, so: true }

answers:
  - stance: yield
    did: "Turned up Saturday morning, sleeves rolled."
    came: >-
      The flat's shifted by four and the old business isn't raised. A week or
      so on, your shopping gets carried from the bus stop to your door before
      you can argue.
    outcome: good
    moves: { kindness: 12, stability: 6 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "I'm in Saturday — just cover my gas for the dump runs."
    came: >-
      A $20 gets handed over Saturday without a word about it. After, it's
      please-and-thank-you on the landing where it used to be
      come-in-and-sit-down.
    outcome: mixed
    moves: { intelligence: 8, kindness: -8 }
    shifts: { owed: 1 }

  - stance: resist
    did: "Made sure it got around: you're busy Saturday."
    came: >-
      The move happens with three instead of four. Sunday on the landing,
      {who} says 'we managed' to Karen while you're passing, at talking
      volume.
    outcome: poor
    moves: { kindness: -14, stability: -4 }
    shifts: { slighted: 1 }
