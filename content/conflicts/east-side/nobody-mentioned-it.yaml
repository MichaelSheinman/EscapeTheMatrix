key: nobody-mentioned-it
among: east-side
follows: slighted
name: "Overheard retelling of the missed delivery"

line: >-
  So I'd asked about the Tuesday, the fridge delivery, and got told yes, no
  bother. Come Tuesday there's no answer at the door, and the van took it back
  to the depot. Got it the week after in the end.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "I never meant anything by it, you know that."
    came: >-
      {who} says fine, it's done, and changes the subject. Next week the
      fridge story gets told again, same details, same tone.
    outcome: mixed
    moves: { kindness: 6, stability: 8, intelligence: -4 }

  - stance: open
    did: "That week without the fridge — how bad was it? Tell me straight."
    came: >-
      {who} tells you plain: a week of tinned food and a chip-shop bill that
      couldn't be spared. Then the kettle goes on and the talk moves to the
      boiler.
    outcome: good
    moves: { kindness: 18, intelligence: 14, stability: 6 }
    shifts: { slighted: -1 }

  - stance: resist
    did: "That's not how it went. I said Wednesday, not Tuesday."
    came: >-
      By Friday there are two fridge stories going round the building, yours
      and {who}'s, and people ask which one they're getting.
    outcome: poor
    moves: { stability: -12, kindness: -10 }
    shifts: { slighted: 1, unsettled: 1 }

  - stance: withdraw
    did: "Kept walking to the stairs."
    came: >-
      The retelling finishes without you. When the delivery comes up at the
      residents' do, it's {who}'s version people repeat back to you.
    outcome: poor
    moves: { stability: 4, kindness: -14 }
    shifts: { unsettled: 1 }
