# The slight, arriving late and sideways. On this landing somebody who is
# struggling gets carried and it is not mentioned afterwards — so the
# consequence of not carrying them is never mentioned either, which is what
# makes it hard to diagnose (§3.6).

key: nobody-mentioned-it
among: east-side
follows: slighted
name: Nobody mentions it

line: >-
  {who} is telling the story of a bad fortnight to somebody else on the landing
  and stops when you come out. Then carries on, at the same volume, with the
  part you are in.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: Stand there and let it be said.
    came: >-
      It takes as long as it takes, and at the end of it {who} says none of it
      was aimed at you, which is how you learn all of it was.
    outcome: mixed
    moves: { kindness: 6, stability: 8, intelligence: -4 }

  - stance: open
    did: Say you had not known it had got that bad, and ask.
    came: >-
      What comes out takes twenty minutes and most of it is not about you at
      all. The part that is gets said properly and then does not come up again.
    outcome: good
    moves: { kindness: 18, intelligence: 14, stability: 6 }
    shifts: { slighted: -1 }

  - stance: resist
    did: Say that is not what happened.
    came: >-
      It becomes a disagreement about a fortnight ago in front of a third person
      who has to stand there for it. Both accounts are now on the landing and
      neither of them is going anywhere.
    outcome: poor
    moves: { stability: -12, kindness: -10 }
    shifts: { slighted: 1, unsettled: 1 }

  - stance: withdraw
    did: Carry on down the stairs.
    came: >-
      Nothing further is said to you about it, ever. The version of the fortnight
      that gets kept is the one that was being told when you left.
    outcome: poor
    moves: { stability: 4, kindness: -14 }
    shifts: { unsettled: 1 }
