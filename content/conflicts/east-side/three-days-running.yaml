key: three-days-running
among: east-side
follows: asking
name: "Third morning in a row, twenty minutes"

line: >-
  It's me again — I know, third morning running. Mum's carer isn't due till
  twenty past and I'll miss my bus. Could you sit with her twenty minutes —
  you're the only one I ask now.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 45 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/again, from: asked }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/friend, so: true }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Go on, catch your bus. I've got her."
    came: >-
      Twenty minutes by the radio till the carer knocks. The fourth morning
      there's no knock at yours, and through the window you see {who} waiting
      on a later bus.
    outcome: mixed
    moves: { kindness: 10, stability: -6 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "I will. Tuesday evening you give me the hour back — my yard needs doing."
    came: >-
      Tuesday at six {who} is at the yard gate with gloves on, and the hour
      gets worked to the minute.
    outcome: mixed
    moves: { intelligence: 12, kindness: -4, stability: 4 }

  - stance: resist
    did: "Not this morning. It's been every day this week."
    came: >-
      {who} says sorry for asking and goes. A week on you see the old woman
      from the ground floor climbing the stairs at seven to sit the twenty
      minutes instead.
    outcome: poor
    moves: { kindness: -10, stability: 6 }
    shifts: { slighted: 1 }
