key: the-fourth-ask
among: east-side
follows: asking
name: "Fourth $40 borrow"

line: >-
  Could you do me $40 till Tuesday? The electric key needs topping up and I'm
  flat till payday. I know — fourth time, I hate asking.

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: true }
  - { term: money/condition/public, so: false }
  - { term: money/condition/spare, reading: 30000 }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Handed over the $40."
    came: >-
      A quick thank-you and it's pocketed. A few weeks on, the same knock
      comes at the same hour, and it's $40 again, this time for the phone
      bill.
    outcome: mixed
    moves: { kindness: 8, stability: -4 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Can't today — ask me end of the week."
    came: >-
      Two days later {who} is at the door again, same $40, the reason now the
      water bill.
    outcome: mixed
    moves: { stability: 4, intelligence: -4 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: "I'll do the $40 if you clear the yard drain this week."
    came: >-
      The drain's running clear by Thursday, leaves bagged and left by the
      bins. {who} knocks to show you the job before taking the money.
    outcome: mixed
    moves: { intelligence: 10, kindness: -6 }

  - stance: resist
    did: "Not this time. I can't keep doing it."
    came: >-
      {who} says fair enough and goes. A week on you pass the second-floor
      landing and hear the same ask, word for word, at the door across the
      landing.
    outcome: poor
    moves: { kindness: -12, stability: 3 }
    shifts: { slighted: 1 }
