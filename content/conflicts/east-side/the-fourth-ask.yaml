key: the-fourth-ask
among: east-side
follows: asking
name: "Fourth $40 borrow"

line: >-
  Could you do me $40 till Tuesday? The electric key needs topping up and I'm
  flat till payday. I know — fourth time, I hate asking.

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: true }
  - { term: money/condition/public, so: false }
  - { term: money/condition/spare, reading: 30000 }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Handed over the $40."
    came: >-
      Ta for the other week, you're a lifesaver. Look — I know how this
      sounds, but any chance of the $40 again? Phone bill this time.
    outcome: mixed
    moves: { kindness: 8, stability: -4 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Can't today — ask me end of the week."
    came: >-
      End of the week's no good now, sorry — water bill's landed. Is there any
      chance of that $40 today instead? I'm at the door.
    outcome: mixed
    moves: { stability: 4, intelligence: -4 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: "I'll do the $40 if you clear the yard drain this week."
    came: >-
      Drain's running clear, did it Thursday morning. Leaves are bagged up by
      the bins if you want a look before you sort me out.
    outcome: mixed
    moves: { intelligence: 10, kindness: -6 }

  - stance: resist
    did: "Not this time. I can't keep doing it."
    came: >-
      No, you've done enough. It's only $40 and it's only till Tuesday, I'll
      try a couple of doors on the second floor. I hate asking, you know I
      hate asking.
    outcome: poor
    moves: { kindness: -12, stability: 3 }
    shifts: { slighted: 1 }
