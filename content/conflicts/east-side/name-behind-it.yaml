# Moved from the riverfront's the-name-on-it (2026-08-10). Vouching, not
# equity: asking to see it in writing is the counted answer here.

key: name-behind-it
among: east-side
follows: asking
name: "Standing reference for the Moore Street flat"

line: >-
  It's a big ask and I know it. The flat above the launderette on Moore Street
  — Mr. Feeny wants a reference, someone who'd answer for me if it went wrong.
  You're the only one he'd take serious — would you put your name to it?

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: false }
  - { term: money/condition/public, so: true }
  - { term: money/condition/spare, reading: 30000 }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Go on then. Give him my number."
    came: >-
      Feeny rang the next evening, asked how long you'd known each other and
      if the rent would come. You said your piece, and {who} had the keys by
      the first of the month.
    outcome: mixed
    moves: { kindness: 8, intelligence: -10 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Let me think on it — could I see it written down first?"
    came: >-
      {who} said fair enough, no rush. By Friday the shop queue had it, with
      grins, that you'd wanted it on paper before you'd stand for a neighbor.
    outcome: poor
    moves: { intelligence: 4, kindness: -12 }
    shifts: { slighted: 1 }

  - stance: bargain
    did: "What am I on the hook for exactly if it goes wrong?"
    came: >-
      {who} laid it out flat — if the rent stopped, Feeny would come to you
      for it, two months at most. You rang him knowing the size of it and said
      your piece.
    outcome: mixed
    moves: { intelligence: 10, kindness: -2 }

  - stance: resist
    did: "I can't put my name to that. I'm sorry."
    came: >-
      {who} said understood, no hard feelings, and got a fella from the taxi
      rank to stand instead. The hellos on the stairs still come, just shorter
      than before.
    outcome: mixed
    moves: { stability: 6, kindness: -6 }
