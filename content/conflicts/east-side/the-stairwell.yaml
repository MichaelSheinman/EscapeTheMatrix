key: the-stairwell
among: east-side
with: [ruthie]
every: 21
follows: easy
name: "Boiler wait assigned without asking"

line: >-
  Right, that's sorted then — the boiler man's coming Thursday morning and
  you'll be in to let him up. Eight till twelve, they said. Good of you.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "Fine, I'll be in Thursday."
    came: >-
      He didn't land till half eleven, the swine, and the heat was back on by
      one. Your whole morning sat on that hallway chair for twenty minutes of
      work.
    title: "You took {who}'s Thursday boiler wait"
    outcome: good
    moves: { kindness: 10, stability: 4 }
    shifts: { owed: 1 }

  - stance: open
    did: "Hang on — who's actually free Thursday? Let's hear it before it's settled."
    came: >-
      Easier than I thought that — first floor's in Thursdays anyway so she's
      taking it. And we've got names down for the next three call-outs while
      we were at it.
    title: "You asked {who} who else was free Thursday"
    outcome: good
    moves: { intelligence: 12, kindness: 12 }

  - stance: resist
    did: "No — you didn't ask me. I won't be in."
    came: >-
      Ground floor took it. Had to swap a shift at the depot to manage it —
      he's told me about that twice on the stairs this week.
    title: "You told {who} you would not be in Thursday"
    outcome: poor
    moves: { kindness: -10, stability: 4 }
    shifts: { slighted: 1 }

  - stance: withdraw
    did: "Went on up before it was settled."
    came: >-
      Thursday, eight till twelve, your name on it — that's what went under
      your door. Wasn't me that wrote it but nobody argued with it either.
    title: "You went on up the stairs before answering {who}"
    outcome: poor
    moves: { stability: -6, kindness: -8, intelligence: -6 }
    shifts: { unsettled: 1 }
