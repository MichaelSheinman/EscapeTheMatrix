# The ordinary friction of living in a building, and the majority case: nothing
# is outstanding, and there is still a thing to be settled out loud.

key: the-stairwell
among: east-side
follows: easy
name: Settled in the stairwell

line: >-
  The boiler man wants a morning and only one of the four floors has to be in
  for it. {who} has already decided which, out loud, on the stairs, and is
  saying so again as you come past.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: Say that works, and take the morning.
    came: >-
      It is settled in under a minute and the boiler man comes on the Tuesday.
      You lose a morning you did not have, and four flats have hot water by the
      evening.
    outcome: good
    moves: { kindness: 10, stability: 4 }
    shifts: { owed: 1 }

  - stance: open
    did: Ask what everybody else's week looks like.
    came: >-
      It takes ten minutes on the stairs and ends up on the second floor's
      Thursday, which suits three of the four. {who} treats the outcome as
      everyone's, which by then it is.
    outcome: good
    moves: { intelligence: 12, kindness: 12 }

  - stance: resist
    did: Say it is not your morning to give.
    came: >-
      Somebody else takes it, and says it is no trouble, and it is not mentioned
      again. It is mentioned again in March.
    outcome: poor
    moves: { kindness: -10, stability: 4 }
    shifts: { slighted: 1 }

  - stance: withdraw
    did: Keep going down the stairs.
    came: >-
      By the time you are back the morning has been allocated and it is yours.
      Nobody asked, which on this landing is what happens to the person who was
      not there.
    outcome: poor
    moves: { stability: -6, kindness: -8, intelligence: -6 }
    shifts: { unsettled: 1 }
