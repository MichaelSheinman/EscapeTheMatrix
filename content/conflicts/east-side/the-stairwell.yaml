key: the-stairwell
among: east-side
follows: easy
name: "Boiler wait assigned without asking"

line: >-
  Right, that's sorted then — the boiler man's coming Thursday morning and
  you'll be in to let him up. Eight till twelve, they said. Good of you.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "Fine, I'll be in Thursday."
    came: >-
      The engineer turns up at half eleven. The heating's back on by one, and
      your Thursday morning went to the hallway chair.
    outcome: good
    moves: { kindness: 10, stability: 4 }
    shifts: { owed: 1 }

  - stance: open
    did: "Hang on — who's actually free Thursday? Let's hear it before it's settled."
    came: >-
      The woman from the first floor says she's in Thursdays anyway. On the
      spot the landing agrees turns for the next three call-outs, names said
      out loud.
    outcome: good
    moves: { intelligence: 12, kindness: 12 }

  - stance: resist
    did: "No — you didn't ask me. I won't be in."
    came: >-
      The fella from the ground floor takes it and has to swap a depot shift
      to manage it. He mentions the swap twice on the stairs that week.
    outcome: poor
    moves: { kindness: -10, stability: 4 }
    shifts: { slighted: 1 }

  - stance: withdraw
    did: "Went on up before it was settled."
    came: >-
      By evening there's a note under your door: boiler man Thursday, eight
      till twelve, your name on it in someone else's writing.
    outcome: poor
    moves: { stability: -6, kindness: -8, intelligence: -6 }
    shifts: { unsettled: 1 }
