key: the-favour-back
among: east-side
follows: owed
name: "Another two-hour favour, Thursday"

line: >-
  I know I still owe you for the allotment afternoon, and here I am asking
  again — could you mind Callum Thursday, half two till half four? Mum's got
  her scan and I can't take him into the waiting room with me.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 120 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/useful, so: false }

answers:
  - stance: yield
    did: "Course. Drop him round at half two."
    came: >-
      Scan ran right over, sorry — half five by the time I got to you. He says
      you let him at the biscuits. I owe you double now.
    outcome: good
    moves: { kindness: 14, stability: 4 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "I will — and you still owe me the two hours from the allotment, mind."
    came: >-
      Two hours' weeding Saturday, two till four on the dot. That's you paid
      back for the Thursday, and much obliged for it.
    outcome: poor
    moves: { intelligence: 6, kindness: -12 }
    shifts: { slighted: 1 }

  - stance: resist
    did: "Thursday's no good. And I'm still owed two hours from the allotment run."
    came: >-
      Got him minded elsewhere. Somebody said 'still owed two hours' to me at
      the bins on Sunday, word for word near enough. Small building.
    outcome: poor
    moves: { kindness: -14, intelligence: 4 }
    shifts: { slighted: 1 }
