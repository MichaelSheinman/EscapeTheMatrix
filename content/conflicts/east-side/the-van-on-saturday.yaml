key: the-van-on-saturday
among: east-side
follows: easy
name: "Sofa-bed and a van, Saturday"

line: >-
  Got the van booked for Saturday morning, picking up a sofa-bed off my
  sister. Three flights up ours, and it's just me and my back. Two hours,
  tops, if there were two of us.

puts: help

facts:
  - { term: help/condition/legal, so: true }
  - { term: help/condition/fee, reading: 0 }
  - { term: help/condition/short, reading: 120 }
  - { term: help/condition/owe, from: owing }
  - { term: help/condition/again, from: asked }
  - { term: help/condition/down, from: slighted }
  - { term: help/condition/friend, so: true }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "I'll take the other end. What time Saturday?"
    came: >-
      Two hours on the stairs, the sofa-bed jammed twice at the second turn.
      Between lifts you get who moved out, who fell out, and why the third
      floor skips Christmas.
    outcome: good
    moves: { kindness: 12, stability: 6, intelligence: 4 }
    shifts: { owed: 1 }

  - stance: bargain
    did: "I'll do it for $40, seeing as it's a whole morning."
    came: >-
      {who} pays the $40 there and then, notes counted into your hand. On the
      landing after, talk of Saturdays and vans stops when you join it.
    outcome: poor
    moves: { intelligence: 6, kindness: -14 }
    shifts: { slighted: 1 }

  - stance: resist
    did: "Saturday's no good for me, sorry."
    came: >-
      The lad from the ground floor takes the other end Saturday and the
      sofa-bed goes up fine. Monday {who} waves same as ever.
    outcome: mixed
    moves: { kindness: -8, stability: 4 }
