# Moved from the riverfront's the-round-number (2026-08-10). Same ask, opposite
# values: here naming a rate and a date is the counted-out-loud answer.

key: till-payday
among: east-side
follows: easy
name: "The $300 till payday"

line: >-
  Hate to even ask — car's at Denny's garage and it's 280 to get it back, and
  I can't get to work without it. Could you do 300 till payday? I get paid the
  15th, I'll square up first thing.

puts: money

facts:
  - { term: money/condition/again, from: asked }
  - { term: money/condition/owe, from: owing }
  - { term: money/condition/repaid, so: true }
  - { term: money/condition/public, so: false }
  - { term: money/condition/spare, reading: 30000 }

raises: { asked: 1 }

answers:
  - stance: yield
    did: "Sure. Come by tonight and I'll have it for you."
    came: >-
      That's the 300 back, all twenties, count it if you want. Car's been off
      Denny's a fortnight. I've thanked you about six times now so I'll stop.
    outcome: good
    moves: { kindness: 10, stability: 2 }
    shifts: { owed: 1 }

  - stance: defer
    did: "Let me see where I'm at after the weekend, alright?"
    came: >-
      Car's still sat at Denny's. Don't be worrying about the weekend, you've
      your own to think about — I'll let you know how I get on.
    outcome: poor
    moves: { stability: -4, intelligence: -4 }
    shifts: { unsettled: 1 }

  - stance: bargain
    did: "I can do 300 if it's back on the 15th and there's twenty on top."
    came: >-
      That's fine. The 15th, with the twenty on top. Thank you so much, I do
      appreciate it.
    outcome: poor
    moves: { intelligence: 6, kindness: -12 }
    shifts: { slighted: 1 }

  - stance: resist
    did: "I'm sorry, I can't swing it right now."
    came: >-
      Don't be daft, it's fine. Your bin went out with mine this morning
      anyway.
    outcome: mixed
    moves: { kindness: -8, stability: 4 }
