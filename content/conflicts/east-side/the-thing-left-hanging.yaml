key: the-thing-left-hanging
among: east-side
follows: unsettled
name: "Fence panel row reopened in company"

line: >-
  No, we're doing this now, since everyone's here — that fence panel. You said
  you'd sort it and it's been six weeks with my garden open to the alley. Six
  weeks!

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: "You're right. I'll sort the panel this week, all of it."
    came: >-
      The landing empties and the panel goes up Saturday. {who}'s hellos after
      are one word each.
    outcome: mixed
    moves: { kindness: 6, stability: 5, intelligence: -6 }
    shifts: { unsettled: -1 }

  - stance: open
    did: "What's this actually about? It's not six weeks of fence."
    came: >-
      It comes out: {who}'s shed was got at through the gap and nobody came to
      look. Next door offers a padlock, the ground floor a spare panel, and
      it's settled on the stairs.
    outcome: good
    moves: { intelligence: 16, kindness: 12, stability: 8 }
    shifts: { unsettled: -2 }

  - stance: resist
    did: "Don't shout at me on the stairs! You want it done, you knock, not this."
    came: >-
      The landing clears fast. That week the kettle-and-biscuits knocks stop
      coming, and hallway chats end when you open your door.
    outcome: poor
    moves: { stability: -14, kindness: -12 }
    shifts: { slighted: 1, unsettled: 1 }

  - stance: withdraw
    did: "Left mid-argument, down the stairs."
    came: >-
      The others sort it between them that evening — the fella next door fixes
      the panel, {who} pays half. The arrangement reaches you already agreed.
    outcome: poor
    moves: { stability: 6, kindness: -10, intelligence: -8 }
    shifts: { unsettled: 1 }
