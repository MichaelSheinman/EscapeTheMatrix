# The one that punishes bookkeeping, which is the sharpest thing this landing
# holds: "a favour asked is a favour done, and nobody writes it down. Keeping a
# count out loud is the rude part, not the asking."
#
# It follows from a credit, so the player only ever meets it while they are
# ahead — which is exactly when saying so is most tempting.

key: keeping-count
among: east-side
follows: owed
name: Somebody says the number out loud

line: >-
  Somebody on the landing says, in front of {who} and two others, that you have
  done more for this building this year than anybody. {who} agrees, and looks at
  you to see what you do with it.

puts: voice

facts:
  - { term: voice/condition/above, so: false }
  - { term: voice/condition/watching, so: true }
  - { term: voice/condition/before, from: known }
  - { term: voice/condition/unsettled, from: unsettled }
  - { term: voice/condition/owe, from: owing }
  - { term: voice/condition/leave, so: true }

answers:
  - stance: yield
    did: Say it is nothing, and change the subject.
    came: >-
      The subject changes and nobody returns to it. It is the third time this has
      happened and each time the room has relaxed a little faster.
    outcome: good
    moves: { kindness: 12, stability: 8 }

  - stance: open
    did: Say the building has carried you plenty of times too, and name one.
    came: >-
      The one you name is remembered by two of the four people standing there,
      and both of them add to it. The story that gets told afterwards is about
      the building rather than about you.
    outcome: good
    moves: { kindness: 16, intelligence: 10, stability: 6 }
    shifts: { owed: -1 }

  - stance: resist
    did: Agree, and say how many times.
    came: >-
      The number is correct and lands like a bill. The conversation carries on
      around it and the four of you go back inside at the same time, which has
      not happened before.
    outcome: poor
    moves: { kindness: -16, intelligence: -6 }
    shifts: { slighted: 1 }

  - stance: withdraw
    did: Say you are late for something.
    came: >-
      What gets said on the stairs after you have gone is kinder than anything
      you would have said, and it gets repeated for a fortnight. Nobody here has
      ever thought less of somebody for leaving before the praise finished.
    outcome: good
    moves: { kindness: 10, stability: 6 }
