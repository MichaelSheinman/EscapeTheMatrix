# The Sunday at the laundromat — the second authored challenge (#25).
#
# This one is the point of the ticket rather than a challenge that happened to
# be next. technical.md §5.2 draws a line — **mechanic types are code,
# challenges are data; new content in an existing type is data only** — and the
# only way to know the line is in the right place is to author a whole challenge
# on the far side of it and touch no Go doing it. Nothing in `internal/` changed
# for this. It is two files.
#
# The directory names are the identity (§5.3): `resolve_conflict` is the family
# it shares with the argument on the stoop, and `b` is the variant. §5.1 asks for
# roughly four variants per family, and this is the second of them.
#
# It names only `where`, which is the other thing worth proving. §4 keeps
# availability and offer as separate concepts — "an event *can* offer a
# challenge; the world *can* expose a challenge entry point; some challenges are
# simply always available" — and the stoop names both, so nothing had yet shown
# that a challenge standing on its own is enough. This one stands in the
# laundromat and waits. Nobody is put in front of you; you walk in with your
# washing on a Sunday and they are already at it.

name: The Sunday at the laundromat
mechanic: dialogue_branch

door: An argument is going on across the laundromat and neither of them is lowering their voice.
enter: Stay and hear it out

where:
  places: [wilmington-laundromat]
  zones: [seats]
