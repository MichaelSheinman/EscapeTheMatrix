# The Sunday at the laundromat — the second `dialogue_branch` challenge (#25).
#
# Authored with no Go written for it, which is the whole of what this file is
# for. §5.2: **new content in an existing type is data only.** The type reading
# it is `internal/challenge/dialogue.go` and it did not learn anything to run
# this; if it had, the line would be in the wrong place and the ticket would have
# failed rather than shipped.
#
# Noor and Iman are sisters. Their father Sami is seventy-nine and has lived on
# Sandhurst Street for forty-one years, three streets from here. Noor does the
# shopping, the appointments, and the nights when he phones at four in the
# morning. Iman lives across the river and sends money every month. There is a
# room at a place on Cardwell Road if the deposit goes in by Thursday, and there
# is a thing neither of them has said: Noor turned down a permanent post in
# November because the shifts were wrong, and Iman has been sending money she
# borrowed. Ekow has run this laundromat for thirty years and knows the father
# better than either of them currently wants to hear.
#
# Ten scenes, five on any passage: the machines, everything laid out, one of four
# readings, one of two places it ends up, and the last thing you say before you
# carry your bag home. `weight` is never shown and `moves` is never named.

scenes:
  - key: the-machines
    where: >-
      The laundromat on the east side, Sunday afternoon, both big machines going
    beats:
      - line: >-
          You come in with your bag and the place is warm and loud, the way it always is
          on a Sunday. Noor has the folding table to herself and a fitted sheet she is
          losing to. Iman is standing by the door with her coat still on, which after
          forty minutes in here means something.
      - who: Noor
        line: >-
          Then take him. Take him Sunday, keep him till Tuesday, and phone me on Tuesday
          night and tell me how it went.
      - who: Iman
        line: >-
          That is not what I said and you know perfectly well it is not what I said.
      - line: >-
          Ekow, who has run this place since before either of them was tall enough to see
          into a machine, turns the radio down without being asked. That is how he says
          he is listening.
    ask: >-
      You know all three of them well enough to be spoken to, and both of them have
      stopped talking because you came in.
    options:
      - key: fold
        text: >-
          Take the other end of the sheet and start folding.
        taken: >-
          Noor hands you a corner without looking up, which is the closest thing to a
          welcome anybody is getting in here today.
        then: laying-it-out
        weight: 2
        moves:
          kindness: 30
      - key: wait
        text: >-
          Put your bag down by the dryers and let them get on with it.
        taken: >-
          Iman turns a few degrees so that you are outside it. You get the argument at
          the volume the rest of the laundromat is getting it.
        then: laying-it-out
      - key: which-place
        text: >-
          Ask which place it is they are talking about.
        taken: >-
          Iman has the leaflet out of her bag before Noor can answer, which tells you
          exactly how long she has been carrying it.
        then: laying-it-out
        weight: 1
        moves:
          intelligence: 20

  - key: laying-it-out
    where: >-
      Still the laundromat. A dryer stops and nobody starts it again
    beats:
      - who: Iman
        line: >-
          Cardwell Road. Fifteen minutes from me, a proper place, a garden they actually
          use, and a room in April if the deposit is in by Thursday.
      - who: Noor
        line: >-
          A room in April. He has been on Sandhurst Street forty-one years.
      - who: Iman
        line: >-
          I know how long. I grew up in it.
      - who: Noor
        line: >-
          Then you know he does not eat if there is nobody there at six.
      - who: Iman
        line: >-
          And you know I have been paying for the six o'clock. Every month. For two
          years. You have never once said out loud that it is a thing I do.
      - line: >-
          There is something each of them has not said. Noor turned down the permanent
          post at the clinic in November, because the shifts ran Tuesday to Saturday and
          Tuesdays are his worst, and she has told nobody, including him. And Iman has
          not been sending money she has. She has been sending money she borrowed, and
          her own house does not know that either.
      - line: >-
          They both stop and look at you, the way people do when they have been going
          round something since Christmas and would take an answer from anybody at all.
    ask: >-
      Whatever you say now, you say having heard the same argument they have. Choose the
      reading you will commit to — there is no correct one, and each of them leads
      somewhere different.
    options:
      - key: money
        text: >-
          Say it looks to you like a money problem in a family's coat: what is actually
          being decided is who pays for what, and the rest of it is downstream of that.
        taken: >-
          Iman hears you say she is right. Noor hears you put a price on the last two
          years of her life. Neither of those is what you said.
        then: the-money
        weight: 1
        moves:
          intelligence: 20
      - key: hours
        text: >-
          Say you do not think Noor is arguing about the home at all.
        taken: >-
          Noor does not look up from the sheet. Iman does, and what is on her face is
          closer to relief than to being contradicted.
        then: the-hours
        weight: 2
        moves:
          kindness: 20
      - key: deciding
        text: >-
          Say the argument is about who gets to decide, and that neither of them has said
          out loud whose decision it actually is.
        taken: >-
          Both of them start to answer and neither of them finishes. You have named the
          thing they have been carefully arguing around, and nobody thanks you for it
          yet.
        then: who-asked-him
        weight: 2
        moves:
          stability: 20
          kindness: 10
      - key: ask-back
        text: >-
          Say you are not going to tell them what it is, and ask Noor what a bad week
          actually looks like.
        taken: >-
          Noor thinks you are asking her to make a case. Iman thinks you have finally
          asked the right person. Only one of them is close, and the question is still
          sitting there.
        then: question
        weight: 1
        moves:
          kindness: 10
          intelligence: 10

  - key: the-money
    where: >-
      The laundromat. Iman has her phone in her hand and has not looked at it once
    beats:
      - who: Iman
        line: >-
          Two hundred and forty a month for two years. I am not saying it to be thanked.
          I am saying it because she talks about me as though I have been away.
      - who: Noor
        line: >-
          You have been away.
      - who: Iman
        line: >-
          Yes. And I have been paying for the not-being-away, and that is not nothing,
          and you have never once let it be a thing that is not nothing.
      - line: >-
          Ekow puts two coins into the machine nearest them so that it starts up. It is a
          way of making a noise in here that is not one of them talking.
    ask: >-
      There is a number in the middle of this, and both of them will look at it, which is
      more than can be said for anything else on the table.
    options:
      - key: both-books
        text: >-
          Tell them to put every number on one piece of paper this week — what she sends,
          what his pension is, what Cardwell Road costs, what the last two years have
          actually cost — at one table, in both their handwriting.
        taken: >-
          Neither of them agrees to it. Both of them stop making the case they were
          making, which is not the same thing and is better.
        then: the-back-room
        weight: 3
        moves:
          stability: 30
          kindness: 10
      - key: not-a-price
        text: >-
          Tell Iman that money sent is not the same as being there, and that she knows it
          already or she would not have said it in that voice.
        taken: >-
          She takes it standing up and does not put the phone away. Noor is careful not
          to look pleased, and is not careful enough.
        then: the-back-room
        weight: 1
        moves:
          kindness: 20
      - key: pay-the-deposit
        text: >-
          Tell them a deposit is refundable and Thursday is Thursday: put it in, and have
          the argument about April in April.
        taken: >-
          Iman says thank you, finally, to somebody. Noor folds the sheet down to a
          square the size of a book and does not say anything at all.
        then: still-here
        moves:
          stability: 10

  - key: the-hours
    where: >-
      The laundromat. Noor has stopped folding, which she has not done all afternoon
    beats:
      - who: Noor
        line: >-
          I am not frightened of the home. I have been in it. It is clean, it smells of
          nothing, and the woman on the desk was kind to me for twenty minutes.
      - who: Iman
        line: >-
          Then what is it.
      - who: Noor
        line: >-
          I turned the post down. In November. The permanent one.
      - line: >-
          Iman's hands come out of her pockets. That is the first she has heard of it, and
          it is the first moment this afternoon in which neither of them is performing.
      - who: Noor
        line: >-
          The shifts were Tuesday to Saturday. He is worst on a Tuesday.
    ask: >-
      She has put something down in front of both of you, and it is not the leaflet.
    options:
      - key: say-it-back
        text: >-
          Say out loud what she gave up, in her own words, so that it has to be answered
          rather than argued with.
        taken: >-
          Noor does not cry and does not thank you. She hears her own reasons coming back
          at her in somebody else's mouth, and lets them stand there.
        then: the-back-room
        weight: 3
        moves:
          kindness: 40
      - key: nobody-asked
        text: >-
          Say that nobody asked her to give it up, which is true and is not the point.
        taken: >-
          It is the kind of true thing that is no use to anybody. She agrees with you
          immediately, which is how you know where it landed.
        then: still-here
      - key: ask-november
        text: >-
          Ask her why she told neither of them in November.
        taken: >-
          She takes long enough that Iman answers for her, and she lets her be wrong, and
          then she does not.
        then: the-back-room
        weight: 2
        moves:
          kindness: 20
          intelligence: 10

  - key: who-asked-him
    where: >-
      The laundromat. Neither of them is looking at the other
    beats:
      - who: Iman
        line: >-
          If I had asked first she would have said no before I got to the end of the
          sentence.
      - who: Noor
        line: >-
          Then I would have said no. That is what asking is.
      - who: Iman
        line: >-
          I did not mean you. I meant him.
      - line: >-
          There it is. Neither of them has asked him — not straight out, not in a way that
          could be answered yes or no — and both of them have known that for about ten
          minutes longer than they have been arguing about it.
    ask: >-
      You are standing between two sisters and a man who is not in the room, and all three
      of you can hear that he is not.
    options:
      - key: ask-him
        text: >-
          Say that the only person who has not been asked is the one it is happening to.
        taken: >-
          Neither of them argues. Noor says he does not always follow it, and hears how
          that sounds about a second after it is out.
        then: the-back-room
        weight: 3
        moves:
          kindness: 20
          stability: 20
      - key: iman-alone
        text: >-
          Tell Iman that finding the place on her own was the decision. The leaflet is
          only paper.
        taken: >-
          She takes it in front of her sister without arguing. Noor had wanted to hear it
          and does not enjoy hearing it.
        then: still-here
        weight: 1
        moves:
          stability: 20
      - key: noor-veto
        text: >-
          Tell Noor that a no arriving before the sentence is finished is not an answer
          either.
        taken: >-
          Iman is careful not to look pleased. Noor hears you say that she is the reason
          nobody in this family asks her anything.
        then: still-here
        weight: 1
        moves:
          intelligence: 20
      - key: both-of-you
        text: >-
          Tell them neither of them is going to be right about that today, and that
          whatever gets decided has to get decided with him in the room.
        taken: >-
          Iman says fine. Noor says fine. It is the first thing they have agreed on since
          Christmas and neither of them notices.
        then: the-back-room
        weight: 3
        moves:
          stability: 30
          kindness: 10

  - key: question
    where: >-
      The laundromat. Your question is still there and Noor has gone back to folding
    beats:
      - who: Noor
        line: >-
          A bad week. He puts the kettle on, forgets it, and puts it on again. He phones
          me at four in the morning to tell me something he told me at six. He is not
          frightened. That is the part nobody believes. He is completely calm and he is
          somewhere else.
      - who: Iman
        line: >-
          You never say any of that on the phone.
      - who: Noor
        line: >-
          No.
      - who: Iman
        line: >-
          Why.
      - who: Noor
        line: >-
          Because you would have found Cardwell Road in March instead of November.
      - line: >-
          Which is an answer, and is also the entire argument, and all three of you can
          hear that it is both.
    ask: >-
      You asked for it and you have got it, and now it is on the table between the two big
      machines where everybody can see it.
    options:
      - key: which-frightens
        text: >-
          Ask Noor which frightens her more — him going somewhere, or her being the one
          who sent him — and then wait past the first answer.
        taken: >-
          The first answer is the home. The second answer, a long way after it, is not.
        then: the-back-room
        weight: 3
        moves:
          kindness: 30
          intelligence: 10
      - key: iman-say-it
        text: >-
          Ask Iman to say out loud, in front of her sister, what she had been picturing
          was happening on Sandhurst Street.
        taken: >-
          She gets four sentences in before she hears herself, and the fifth one is
          quieter and truer than the first four.
        then: the-back-room
        weight: 2
        moves:
          intelligence: 30
      - key: let-it-sit
        text: >-
          Say nothing at all, and let the silence be theirs to fill.
        taken: >-
          It goes on long enough to be a decision. Iman fills it, and what she fills it
          with is Thursday, which is where they started.
        then: still-here
        weight: 1
        moves:
          stability: 10

  - key: the-back-room
    where: >-
      Ekow's back room, past the machines. Three chairs, a kettle, and a box of lost socks
    beats:
      - line: >-
          He gets the door with his foot because his hands are full of somebody's shirts,
          and then he says the thing he has been holding since you came in.
      - who: Ekow
        line: >-
          He was here on Wednesday. Your father. He asked me to help him fill in a form,
          and he asked me not to tell either of you.
      - line: >-
          He puts the shirts down. Neither sister says anything. The kettle, which nobody
          has touched, chooses that moment to click off.
      - who: Ekow
        line: >-
          It was the one for the memory clinic. He had already signed it.
    ask: >-
      Something has landed in the middle of this that none of the three of you brought,
      and it belongs to the man who is not here.
    options:
      - key: he-decided
        text: >-
          Say that he has been making a decision this whole time, on his own, in a
          laundromat, because neither of his daughters had left him anywhere else to make
          one.
        taken: >-
          Nobody says anything for a while. Iman puts the leaflet back in her bag face
          down, which is not a no.
        then: last-word-back-room
        weight: 3
        moves:
          intelligence: 30
          stability: 20
      - key: ask-ekow
        text: >-
          Ask Ekow to tell the whole of Wednesday, in front of both of them.
        taken: >-
          It takes him two minutes and the useful part is not the form. It is that Sami
          came in at eleven on a Wednesday with a Sunday's washing, and did not appear to
          know that either of those was true.
        then: last-word-back-room
        weight: 2
        moves:
          intelligence: 20
          kindness: 10
      - key: give-the-room
        text: >-
          Stand up, say you will get out of their way, and mean it.
        taken: >-
          Noor walks you as far as the door of the back room and stands in it while you
          go, which is how this street says thank you.
        then: last-word-back-room
        weight: 2
        moves:
          kindness: 30
      - key: back-to-thursday
        text: >-
          Bring it back to Thursday, and to the deposit.
        taken: >-
          Iman is grateful and Noor is not, and something that had just been said out loud
          goes quietly back to being a thing nobody says.
        then: last-word-back-room
        weight: -1
        moves:
          kindness: -20

  - key: still-here
    where: >-
      The laundromat. Somebody else's machine finishes and nobody goes to it
    beats:
      - line: >-
          Ekow comes past with a basket on his hip and stops, which he has not done all
          afternoon.
      - who: Ekow
        line: >-
          Your father was in on Wednesday. He asked me to help him with a form, and he
          asked me not to say.
      - line: >-
          He does not say what the form was, and he does not have to. He stands there
          holding the basket, waiting to find out whether he is going to be asked.
      - line: >-
          Noor has been saying all afternoon that nobody asks him anything. Somebody did,
          and it was him, and Iman does not say one word.
    ask: >-
      Something has landed in the middle of this that none of the three of you brought.
    options:
      - key: ask-what-form
        text: >-
          Ask Ekow what the form was, out loud, so that all three of you hear the answer
          at the same time.
        taken: >-
          It was the memory clinic and he had already signed it. Noor writes the date on
          the back of her hand, which is the most hopeful thing she has done all
          afternoon.
        then: last-word-machines
        weight: 3
        moves:
          intelligence: 30
      - key: let-it-land
        text: >-
          Say nothing, and let Noor have the minute.
        taken: >-
          She has it. Iman, to her credit, lets her have it, and puts the leaflet away
          without being asked to.
        then: last-word-machines
        weight: 2
        moves:
          kindness: 20
          stability: 10
      - key: told-you
        text: >-
          Tell Noor that keeping him on Sandhurst Street was never going to hold.
        taken: >-
          She agrees with you immediately and pleasantly, and does not say anything else
          for the rest of the afternoon.
        then: last-word-machines
        weight: -2
        moves:
          kindness: -20
      - key: ekow-sit
        text: >-
          Ask Ekow to put the basket down and sit with the three of you for a minute.
        taken: >-
          He does, on the corner of the folding table, and what he has turns out to be
          thirty years of Sami and about four minutes of Wednesday. The four minutes are
          the useful part.
        then: last-word-machines
        weight: 2
        moves:
          kindness: 20
          intelligence: 10

  - key: last-word-back-room
    where: >-
      The back room. The kettle has boiled twice and nobody has made anything with it
    beats:
      - who: Noor
        line: >-
          You have heard all of it now. More of it than our aunt has.
      - who: Iman
        line: >-
          So what would you do?
      - line: >-
          It comes back to you, the way it always comes back to whoever stayed in the
          room.
    ask: >-
      One thing, and then you take your washing home. Whatever you say is what they still
      have on Thursday.
    options:
      - key: hand-it-back
        text: >-
          Say that you do not have to live with it and they do, and that you would rather
          they answered it with him than took your answer for it.
        taken: >-
          Iman says that is not an answer. Noor says yes it is, and they are looking at
          each other while they say it.
        weight: 3
        moves:
          kindness: 30
          stability: 20
      - key: say-what-youd-do
        text: >-
          Tell them what you would do, plainly, and own it.
        taken: >-
          They both take it seriously, which is the risk. Whatever happens on Thursday now
          has your name somewhere in it.
        weight: 2
        moves:
          stability: 20
      - key: to-noor
        text: >-
          Say one thing, to Noor: that what she has been doing is not nothing, and that it
          was never going to be enough on its own, and that both of those are true at
          once.
        taken: >-
          She hears the first half. Iman hears the second half. In about a week they will
          each have been told what they needed and neither of them will remember who by.
        weight: 2
        moves:
          kindness: 20
          intelligence: 10
      - key: to-iman
        text: >-
          Say one thing, to Iman: that the next time she crosses the river she comes for a
          Tuesday, and stays over.
        taken: >-
          She says of course. Noor says nothing, but she is the one who carries your bag
          out to the door.
        weight: 2
        moves:
          stability: 30

  - key: last-word-machines
    where: >-
      The laundromat. Your washing has been done for twenty minutes
    beats:
      - who: Iman
        line: >-
          Well. Say something, then.
      - who: Noor
        line: >-
          They do not have to say anything.
      - line: >-
          Ekow turns the radio back up, which is the closest thing to privacy this room
          has. Whatever you say now you say out here, where the whole street's washing can
          hear it.
    ask: >-
      One thing, and then you carry your bag home.
    options:
      - key: one-each
        text: >-
          Give them one sentence each, and go.
        taken: >-
          Neither sentence is the one they wanted. Both of them are still at the folding
          table repeating them to each other when you get to the corner.
        weight: 2
        moves:
          kindness: 20
          stability: 10
      - key: take-a-tuesday
        text: >-
          Say you will take him yourself, once, on a Tuesday — and that you will tell them
          both honestly what a Tuesday is like.
        taken: >-
          Noor says do, in the voice of somebody who does not expect it. It is the
          expecting that would have been worth something.
        weight: 2
        moves:
          kindness: 20
      - key: nothing-more
        text: >-
          Say you have said everything you have.
        taken: >-
          Iman thanks you for your time. Noor has already gone back to the sheet.
      - key: pick-a-side
        text: >-
          Tell them which one of them is right.
        taken: >-
          One of them is delighted with you for about a minute. After that both of them
          are on their own with it, and one of them is on her own with it in front of a
          man who has known them since they were children.
        weight: -1
        moves:
          stability: -20

# The outcome bands, with the reaction authored per branch (§5.1). Four rather
# than three, for the same reason the stoop has four: the difference between
# being humoured and being taken seriously is the difference these challenges
# are about. None of them tells the player what they did well, none is a mark,
# and none confirms that any reading was the right one (§3.10). Each is simply
# what the street is like the next time you walk down it.
#
# The floors are set against this plan's own bounds, and the loader checks them:
# an outcome no passage can reach is a failed build.
outcomes:
  - key: talked-past
    at-least: -2
    reaction: >-
      You are two streets away before you hear yourself go over it again, and by Wednesday
      you have stopped. You see Iman's car outside Sandhurst Street on Thursday morning
      and it is gone by eleven. Nobody tells you which way it went, and after a while you
      understand that not being told is the answer to the question of what you were in
      that room.

  - key: heard
    at-least: 4
    reaction: >-
      Ekow says, the next time you are in, that they were both still there at six and that
      they went out together, which he mentions the way people mention weather they have
      an opinion about. Noor nods at you across the road on Tuesday the way she nods at
      people who live here. Nobody says what was decided, and it is clear enough that
      something was.

  - key: taken-seriously
    at-least: 9
    reaction: >-
      On Thursday there is a note through your door in Noor's handwriting saying the two
      of them took him to the doctor on Wednesday and that all three of them went in
      together, and that the going in together was the part that mattered. Cardwell Road
      is still Cardwell Road. Something else moved. Iman asks for your number before she
      drives back, and it is the kind of asking that expects to be used.

  - key: moved
    at-least: 11
    reaction: >-
      You get it in pieces over the following fortnight, from Ekow and from the woman who
      does the ironing and eventually from Sami himself, on his own step, with a cup of
      tea he made without being asked. They did not send the deposit. Or they did — he
      does not say, and you understand you are not being told because it stopped being the
      question. What he does say is that the three of them sat down on the Sunday, all of
      them, at one table, and that it was the first honest afternoon that family has had
      since their mother died. Then he asks how you are, and waits for the answer.
