# The argument on the stoop — §3.10's own worked example, authored.
#
# This is `dialogue_branch` content and nothing else: no Go reads it by name,
# and the same file with different words in it is a different challenge. What
# reads it is `internal/challenge/dialogue.go`, which was lifted out of the Go
# this challenge was first written as (#24 → #25) — §5.2's **extract the type on
# the second instance, not the first**, done.
#
# The shape: ten scenes, five on any passage through, which is §3.10's six
# minutes. The steps, everything laid out, one of four readings, one of two
# places it ends up, and the last thing you say before you go up your own
# stairs. The branching is real — the four readings are four different scenes
# with different people saying different things — and it converges on purpose,
# because a fifth act authored four times over would be four times the writing
# for a difference the player has already made.
#
# `weight` is never shown and `moves` is never named. §3.10: hidden scoring,
# "never surfaced as a grade, never confirmed as right". The only account of how
# it went that a player ever gets is the reaction of the band their trail landed
# in, at the bottom of this file.
#
# The magnitudes in `moves` are against simulation.CreditHalf, which is 240: a
# whole passage through this pays somewhere between about 60 and 200 across two
# or three factors. Worth several of internal/social's endorsements, nowhere
# near a factor's own scale — a six-minute endeavour should be the best
# afternoon's work in the game and should not be the only thing worth doing.

scenes:
  - key: the-steps
    where: >-
      The steps of your building, a quarter to seven
    beats:
      - line: >-
          You come up the block with your keys already out. Marisol from the second
          floor is on the top step with her bag still on her shoulder, and Dev is two
          steps below her, which is not where a man stands if the conversation has been
          going well.
      - who: Marisol
        line: >-
          You went there on your own. You sat in that office on your own and let a man
          in a fleece explain my life to me through you.
      - who: Dev
        line: >-
          I took a form. Mari. I took a piece of paper off a table.
      - line: >-
          They see you at the same moment and both stop, which is worse than being
          ignored.
    ask: >-
      There is a way of coming into somebody else's argument, and you are about to pick
      one.
    options:
      - key: sit
        text: >-
          Sit down on the step below them and put your keys away.
        taken: >-
          Marisol moves her bag off the step to make room for you. It is not agreement.
          It is room.
        then: laying-it-out
        weight: 2
        moves:
          kindness: 30
      - key: stand
        text: >-
          Stay standing, keys still in your hand.
        taken: >-
          Neither of them moves over. You are somebody on the way to somewhere else, and
          they go on talking across you.
        then: laying-it-out
      - key: ask
        text: >-
          Ask what the piece of paper actually says.
        taken: >-
          Dev has it out of his jacket before Marisol can answer, which is its own
          answer.
        then: laying-it-out
        weight: 1
        moves:
          intelligence: 20
  - key: laying-it-out
    where: >-
      Still the steps. Nobody has gone inside
    beats:
      - who: Dev
        line: >-
          Ellery are offering eighteen thousand to anybody with a lease. Sign it, be out
          by the end of the quarter, keep your deposit. Nine of the twelve have taken
          it.
      - who: Marisol
        line: >-
          Nine of the twelve were frightened into it in a week. If six of us hold, that
          number moves. It always moves.
      - who: Dev
        line: >-
          The boiler died in January and came back in March. The roof is a tarpaulin and
          a prayer. Eighteen is a deposit on somewhere with a second bedroom and a
          landlord who picks up the phone.
      - who: Marisol
        line: >-
          My mother sat on this step. I was nine. I can tell you which window is which
          from the street with my eyes shut.
      - line: >-
          There is a thing each of them has not said. Dev went to that office alone, on
          a Tuesday, and came home with his coat still on. And Marisol has been across
          the river to look at her sister's spare room, and did not say that either.
      - line: >-
          They stop and look at you the way people do when they have been going round
          something for eleven days and would take an answer from a stranger.
    ask: >-
      Whatever you say now, you say having heard the same argument they have. Choose the
      reading you will commit to — there is no correct one, and each of them leads
      somewhere different.
    options:
      - key: money
        text: >-
          Say it looks to you like a number: eighteen is too low for what they are being
          asked to give up, and everything else is downstream of that.
        taken: >-
          Marisol hears you say that it is about the money. It is not quite what you
          said, but it is what she hears, and she folds her arms.
        then: money
        weight: 1
        moves:
          intelligence: 20
      - key: leaving
        text: >-
          Say you do not think Marisol is arguing about money at all.
        taken: >-
          Dev hears you take her side. Marisol hears somebody finally say out loud the
          sentence she has not managed to get to.
        then: leaving
        weight: 2
        moves:
          kindness: 20
      - key: deciding
        text: >-
          Say the argument is about who gets to decide, not about what gets decided.
        taken: >-
          Both of them look at the step. You have named the thing neither of them was
          arguing about out loud, and neither of them thanks you for it yet.
        then: deciding
        weight: 2
        moves:
          stability: 20
          kindness: 10
      - key: ask-back
        text: >-
          Say you are not going to tell them what it is, and ask Dev what he thought
          would happen when he came home with it.
        taken: >-
          Dev thinks you are stalling. Marisol thinks you are on her side. Neither of
          them is right, and the question is still sitting there.
        then: question
        weight: 1
        moves:
          kindness: 10
          intelligence: 10
  - key: money
    where: >-
      The steps. Dev has the form open on his knee
    beats:
      - who: Dev
        line: >-
          Then say what the number should be. I have done this on the back of a receipt
          eleven times and it does not get better for being shouted at.
      - who: Marisol
        line: >-
          It is not a number. It is a price. Those are not the same thing and you know
          they are not.
      - who: Dev
        line: >-
          It expires Friday. That is on the paper. That is not me.
    ask: >-
      There is a number in the middle of this, and it is the one thing both of them will
      look at.
    options:
      - key: hold-out
        text: >-
          Tell them a first offer is a first offer, and nobody's first is their last —
          least of all a company that has already had nine signatures for the price of
          one.
        taken: >-
          Marisol says thank you to the step in front of her. Dev writes Friday on the
          top of the form and underlines it twice.
        then: kitchen
        weight: 1
        moves:
          intelligence: 20
      - key: take-it
        text: >-
          Tell them eighteen is more money than this building has put in their hands in
          ten years.
        taken: >-
          Dev nods once. Marisol looks at you as though you had been in the room in the
          fleece all along.
        then: steps-again
        moves:
          stability: 10
      - key: numbers-together
        text: >-
          Tell them to put every number on one piece of paper tonight, at the same
          table, in both their handwriting.
        taken: >-
          Neither of them agrees to it. Both of them stop making the case they were
          making, which is not the same thing and is better.
        then: kitchen
        weight: 3
        moves:
          stability: 30
          kindness: 10
  - key: leaving
    where: >-
      The steps. Marisol has gone quiet, which Dev is not used to
    beats:
      - who: Marisol
        line: >-
          I am not sentimental. I am not. I know exactly what those stairs smell like in
          August.
      - who: Dev
        line: >-
          I am not asking her to forget any of it. I am asking her to be warm in
          February.
      - who: Marisol
        line: >-
          I went and stood in Yenny's spare room. Last Thursday. I stood in it and I
          hated that I was standing in it.
      - line: >-
          Dev turns his head. That is the first he has heard of it.
    ask: >-
      She has put something down in front of both of you, and it is not the offer.
    options:
      - key: name-it
        text: >-
          Say out loud what she would be losing, in her own words, so that it has to be
          answered rather than argued with.
        taken: >-
          Marisol does not cry and does not thank you. She listens to her own reasons
          coming back at her in somebody else's mouth, and lets them stand.
        then: kitchen
        weight: 3
        moves:
          kindness: 40
      - key: bricks
        text: >-
          Say a building is bricks, and the people in it are what she would be taking
          with her.
        taken: >-
          It is the kind of true thing that is no use. Marisol says yes, of course, and
          goes back to being quiet in a different way.
        then: steps-again
      - key: ask-marisol
        text: >-
          Ask Marisol what she went to look at the room for.
        taken: >-
          She takes long enough that Dev answers for her, and she lets him be wrong, and
          then she does not.
        then: kitchen
        weight: 2
        moves:
          kindness: 20
          intelligence: 10
  - key: deciding
    where: >-
      The steps. Neither of them is looking at the other
    beats:
      - who: Dev
        line: >-
          If I had asked first she would have said no before I finished the sentence.
      - who: Marisol
        line: >-
          Then I would have said no. That is what asking is.
      - who: Dev
        line: >-
          It is not only the boiler.
      - line: >-
          He stops. Whatever the rest of that sentence was, it goes back in.
    ask: >-
      You are standing in the middle of a marriage with the lid off, and both of them
      are waiting.
    options:
      - key: he-went-alone
        text: >-
          Tell Dev that going alone was the decision. The form was only paper.
        taken: >-
          He takes it, in front of her, without arguing. Marisol had wanted to hear it
          and does not enjoy hearing it.
        then: steps-again
        weight: 1
        moves:
          stability: 20
      - key: she-would-say-no
        text: >-
          Tell Marisol that a no arriving before the sentence ends is not an answer
          either.
        taken: >-
          Dev is careful not to look pleased, and is not careful enough. Marisol hears
          you say she is the reason he went alone.
        then: steps-again
        weight: 1
        moves:
          intelligence: 20
      - key: both-in-the-room
        text: >-
          Tell them neither of them is going to be right about that tonight, and that
          whatever gets decided has to get decided with both of them in the room.
        taken: >-
          Dev says fine. Marisol says fine. It is the first thing they have agreed on in
          eleven days and neither of them notices.
        then: kitchen
        weight: 3
        moves:
          stability: 30
          kindness: 10
  - key: question
    where: >-
      The steps. Your question is still there and Dev is still not answering it
    beats:
      - who: Dev
        line: >-
          I thought I would come home with a number and she would have something she
          could say yes to.
      - who: Marisol
        line: >-
          You thought you would come home with it done.
      - who: Dev
        line: >-
          Yes.
      - who: Marisol
        line: >-
          I am not frightened of moving. I am frightened of being the reason we are
          still like this in ten years, and of being the reason we left the only place I
          have ever been from. Both. At the same time. That is what it is like in there.
    ask: >-
      You asked for it and you have got it, and now it is in the middle of the step
      where all three of you can see it.
    options:
      - key: what-afraid
        text: >-
          Ask Marisol which of the two frightens her more, and then wait past the first
          answer.
        taken: >-
          The first answer is the building. The second answer, a long way after it, is
          not.
        then: kitchen
        weight: 3
        moves:
          kindness: 30
          intelligence: 10
      - key: what-would-you-do
        text: >-
          Ask Dev to say, out loud and in front of her, what he would actually do with
          eighteen thousand.
        taken: >-
          He gets four sentences in before he hears himself, and the fifth one is
          quieter and truer than the first four.
        then: kitchen
        weight: 2
        moves:
          intelligence: 30
      - key: nothing
        text: >-
          Say nothing at all, and let the silence be theirs to fill.
        taken: >-
          It goes on long enough to be a decision. Marisol fills it, and what she fills
          it with is the offer, which is where they started.
        then: steps-again
        weight: 1
        moves:
          stability: 10
  - key: kitchen
    where: >-
      Their kitchen, second floor. The form is on the table under a bowl of keys
    beats:
      - line: >-
          You get taken upstairs the way people take you upstairs when the street has
          become the wrong room. The kettle goes on because the kettle has to go on.
      - who: Dev
        line: >-
          Mari. My hours went to twenty-six in March.
      - line: >-
          He says it to her, not to you. Marisol puts the two mugs down very carefully,
          as though the mugs were the fragile thing.
      - who: Marisol
        line: >-
          March.
      - who: Dev
        line: >-
          March.
    ask: >-
      He has said it in front of you, which is a thing you did rather than a thing that
      happened.
    options:
      - key: give-them-the-room
        text: >-
          Stand up, say you will get out of their way, and mean it.
        taken: >-
          Marisol walks you to the door and stands in it while you go down, which is how
          this building says thank you.
        then: last-word-kitchen
        weight: 2
        moves:
          kindness: 30
      - key: hold-the-thread
        text: >-
          Stay where you are and ask him what March changed.
        taken: >-
          He answers you and looks at her, so it is her he is telling. Twenty-six hours,
          a van he no longer has the keys of, and a letter he did not open until April.
        then: last-word-kitchen
        weight: 2
        moves:
          intelligence: 30
      - key: say-the-obvious
        text: >-
          Say the obvious thing: the offer and the hours are one conversation now, and
          they have been having two.
        taken: >-
          Nobody says anything for a while. Marisol pulls the form out from under the
          bowl of keys and turns it face down, which is not a no.
        then: last-word-kitchen
        weight: 3
        moves:
          intelligence: 30
          stability: 20
      - key: press-the-signature
        text: >-
          Bring it back to Friday, and to the form under the keys.
        taken: >-
          Dev is grateful and Marisol is not, and something that had just been said out
          loud goes quietly back to being a thing nobody says.
        then: last-word-kitchen
        weight: -1
        moves:
          kindness: -20
  - key: steps-again
    where: >-
      Still the steps. A window goes up on the ground floor
    beats:
      - who: Ivo
        line: >-
          Nine signed. And I will tell you what the girl in that office told my nephew
          — the top floor's number went down last week. Not up. Down.
      - line: >-
          Ivo from 1B has been at the window for however long this has been going on,
          and says it the way people say things they have been holding on to.
      - line: >-
          Marisol's whole argument has been that the number moves. It has moved. Dev
          does not say anything at all, which is worse than if he had.
    ask: >-
      Something has landed in the middle of it that none of the three of you brought.
    options:
      - key: check-it
        text: >-
          Say that nobody should move eighteen thousand on something Ivo's nephew heard,
          and that the office can be asked in the morning.
        taken: >-
          Ivo is offended for about four seconds. Marisol writes the office number on
          the back of her hand, which is the most hopeful thing she has done all
          evening.
        then: last-word-steps
        weight: 3
        moves:
          intelligence: 30
      - key: let-it-land
        text: >-
          Say nothing, and let Marisol have the minute.
        taken: >-
          She has it. Dev, to his credit, lets her have it too, and puts the form back
          in his jacket without being asked.
        then: last-word-steps
        weight: 2
        moves:
          kindness: 20
          stability: 10
      - key: told-you
        text: >-
          Tell Marisol that holding out was never going to hold.
        taken: >-
          She agrees with you immediately and pleasantly, and does not say anything else
          for the rest of the evening.
        then: last-word-steps
        weight: -2
        moves:
          kindness: -20
      - key: ask-ivo
        text: >-
          Ask Ivo to come out onto the step and tell all three of you the whole of what
          he heard.
        taken: >-
          He comes out in slippers with the whole of it, which turns out to be two
          thirds rumour and one third a date. The date is the useful part.
        then: last-word-steps
        weight: 2
        moves:
          intelligence: 10
          kindness: 20
  - key: last-word-kitchen
    where: >-
      The kitchen. Both mugs have gone cold
    beats:
      - who: Marisol
        line: >-
          You have heard all of it now. More of it than my sister has.
      - who: Dev
        line: >-
          So what would you do?
      - line: >-
          It comes back to you, the way it always comes back to whoever stayed in the
          room.
    ask: >-
      One thing, and then you go home. Whatever you say is what they still have on
      Friday.
    options:
      - key: hand-it-back
        text: >-
          Say that you do not have to live with it and they do, and that you would
          rather they answered it together than took your answer.
        taken: >-
          Dev says that is not an answer. Marisol says yes it is, and they are looking
          at each other while they say it.
        weight: 3
        moves:
          kindness: 30
          stability: 20
      - key: say-what-youd-do
        text: >-
          Tell them what you would do, plainly, and own it.
        taken: >-
          They both take it seriously, which is the risk. Whatever happens on Friday now
          has your name somewhere in it.
        weight: 2
        moves:
          stability: 20
      - key: to-marisol
        text: >-
          Say one thing, to Marisol: that being from somewhere is not a reason on its
          own, and it is not nothing either.
        taken: >-
          She hears the first half. Dev hears the second half. In about a week they will
          each have been told what they needed and neither will remember who said it.
        weight: 2
        moves:
          kindness: 20
          intelligence: 10
      - key: to-dev
        text: >-
          Say one thing, to Dev: that the next time he goes to that office he goes with
          her.
        taken: >-
          He says of course. Marisol says nothing, but she is the one who walks you
          down.
        weight: 2
        moves:
          stability: 30
  - key: last-word-steps
    where: >-
      The steps. It is dark now and nobody has gone in
    beats:
      - who: Dev
        line: >-
          Well. Say something, then.
      - who: Marisol
        line: >-
          They do not have to say anything.
      - line: >-
          The ground-floor window closes. Whatever you say now you say out here, where
          the whole building can hear it.
    ask: >-
      One thing, and then you go up your own stairs.
    options:
      - key: one-thing-each
        text: >-
          Give them one sentence each, and go.
        taken: >-
          Neither sentence is the one they wanted. Both of them are still on the step
          repeating them to each other when you get your door open.
        weight: 2
        moves:
          kindness: 20
          stability: 10
      - key: walk-up
        text: >-
          Say you will knock tomorrow, and mean it.
        taken: >-
          Marisol says do, in the voice of somebody who does not expect it. It is the
          expecting that would have been worth something.
        weight: 2
        moves:
          kindness: 20
      - key: nothing-more
        text: >-
          Say you have said everything you have.
        taken: >-
          Dev thanks you for your time. Marisol has already got her keys out.
      - key: pick-a-side
        text: >-
          Tell them which one of them is right.
        taken: >-
          One of them is delighted with you for about a minute, and after that both of
          them are on their own with it and one of them is on their own with it in front
          of a neighbour.
        weight: -1
        moves:
          stability: -20

outcomes:
  - key: talked-past
    at-least: -2
    reaction: >-
      You are on your own landing before you hear it start again below you, in the same
      two voices and the same order, as though the last hour had been weather. Whatever
      was decided down there, you were not part of it. In the morning the form is gone
      from the table and neither of them says which way it went.
  - key: heard
    at-least: 4
    reaction: >-
      It goes quiet below you about ten minutes after you leave, which is not nothing.
      You pass Dev on the stairs on Thursday and he says they are talking about it
      properly now, and does not say what about, and does not have to. Marisol nods at
      you from the second-floor window the way she nods at people who live here.
  - key: taken-seriously
    at-least: 8
    reaction: >-
      On Friday there is a note under your door in Marisol's handwriting saying they
      went to the office together and came back with nothing, and that going together
      was the part that mattered. The number did not move. Something else did. They ask
      you up on Sunday and it is the sort of asking that expects a yes.
  - key: moved
    at-least: 11
    reaction: >-
      You hear about it in pieces over the following week, from Ivo and from the woman
      on four and eventually from Marisol herself. They did not sign. Or they did —
      she does not say, and you understand that you are not being told because it
      stopped being the question. What she does say is that they had the whole of it out
      on the Tuesday, all of it, at one table, and that it was the first honest evening
      in that flat since March. Then she asks how you are, and waits for the answer.
