# The argument on the stoop — the first authored challenge (#24).
#
# The directory names are the identity (technical.md §5.3): `resolve_conflict`
# is the family and `a` is the variant, and neither is repeated in here. The
# words are in `dialogue.yaml` beside this file, which is the config document of
# the `dialogue_branch` mechanic type and belongs to it entirely — this file
# says which type runs the challenge and where the challenge can be reached, and
# nothing about what happens in it.
#
# It was written in Go first, and that was the discipline rather than a
# shortcut. §5.2: **extract the type on the second instance, not the first.** So
# #24 authored the whole of it in `internal/challenge/stoop.go`, and #25 lifted
# `dialogue_branch` out of that file once there was a second challenge of the
# same shape to be the type of. The words did not change in the move.
#
# It names both of §4's ways in, which is the whole of what that section
# separates:
#
#   opens   the awaiting event that offers it. Accepting `two-people-arguing`
#           begins the run and leaves the event pending until it finishes.
#   where   the entry point that stands there of its own accord. They are on
#           that step whether or not the world has just put them in front of
#           you, and walking up to your own door is enough to join in.
#
# Either way it is played once, ever (§5.1).

name: The argument on the stoop
mechanic: dialogue_branch

opens: two-people-arguing

where:
  places: [east-side]
  zones: [home-door]
