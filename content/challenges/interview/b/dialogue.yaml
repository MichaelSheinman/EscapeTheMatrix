# The management interview, minimal (content/challenges/SPEC.md, 2026-08-10).
#
# Shared by two jobs — operations on the east side, billing on the riverfront —
# so every string stays job-generic. Weights 0 / 2 / 3, troll -4.

scenes:
  - key: opening
    where: A downtown meeting room, ten o'clock.
    beats:
      - who: DIRECTOR
        line: Walk me through what you run now. Day to day, what's actually yours?
    ask: What do you say?
    options:
      - key: the-list
        text: Whatever's on my list that morning. My supervisor sets it and I clear it, every day.
        taken: She asks who sets the list.
        then: scenario
        weight: 0

      - key: the-schedule
        text: The weekly schedule, start to finish. I build it, send it, and when it breaks I'm the call.
        taken: She writes as you talk.
        then: scenario
        weight: 2

      - key: the-fridays
        text: The schedule, end to end. Fridays used to run two hours over. I got that to twenty minutes.
        taken: She asks how you measured that, and against what.
        then: scenario
        weight: 3

      - key: the-league
        text: The office fantasy league. Eleven teams, zero disputes in two seasons. That's management.
        taken: She asks, without looking up, whether the league has a budget.
        then: scenario
        weight: -4

  - key: scenario
    where: The same room, twenty minutes in.
    beats:
      - who: DIRECTOR
        line: >-
          Say a number you own has slipped two months running. What does your
          first week look like?
    ask: What do you say?
    options:
      - key: longer-days
        text: Head down, longer days, until it's back. That's always worked for me before.
        taken: She asks what the extra hours would actually go on.
        then: close
        weight: 0

      - key: find-the-leak
        text: Pull it apart day by day until I can point at where it leaks, then fix that one step.
        taken: She asks what you'd pull apart first.
        then: close
        weight: 2

      - key: and-a-check
        text: Find the leak, fix the step, and bolt a weekly check on so it can't slip quietly again.
        taken: She asks what the check would look like and who would see it.
        then: close
        weight: 3

      - key: stop-reporting
        text: I'd stop reporting it for a bit. Numbers behave better when nobody's staring at them.
        taken: She writes that down word for word and says they may come back to it.
        then: close
        weight: -4

  - key: close
    where: The same room, coming up on the hour.
    beats:
      - who: DIRECTOR
        line: This role means holding people to targets. Tell me about a time you had to.
    ask: What do you say?
    options:
      - key: rarely-comes-to-it
        text: Truthfully, it's rarely come to that. Set things up right and people police themselves.
        taken: She asks again for one specific time it did come to that.
        weight: 0

      - key: the-cutoff
        text: One of ours kept missing Thursday cutoff. We had it out, plainly, and he never missed again.
        taken: She notes it and checks the time.
        weight: 2

      - key: cost-me-the-friendship
        text: I pulled a friend's shift over missed cutoffs. Cost me the friendship. I'd do it again.
        taken: She asks how it stands between you now.
        weight: 3

      - key: the-rota
        text: I hold my flatmate to the cleaning rota. Two years running. He's tried to move out twice.
        taken: She says the rota sounds well enforced and asks for a workplace example.
        weight: -4

outcomes:
  - key: not-this-one
    at-least: -12
    reaction: >-
      An email from the office: they've moved forward with candidates closer to
      the profile. They thank you for your time.

  - key: kept-on-file
    at-least: 4
    reaction: >-
      An email: a strong conversation, but nothing open right now. Your details
      stay with them for the next role.

  - key: the-job
    at-least: 7
    reaction: >-
      A call from the office: the role is yours. They'll send the terms over
      this afternoon.

  - key: the-mandate
    at-least: 9
    reaction: >-
      The director calls you herself: the role is yours, full mandate, start as
      soon as you can get free. Terms follow by email.
