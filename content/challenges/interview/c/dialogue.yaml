# The counter interview, minimal (content/challenges/SPEC.md, 2026-08-10).
#
# Shared by two jobs — the clinic front desk and the bank counter — so every
# string stays job-generic. Weights 0 / 2 / 3, troll -4.

scenes:
  - key: opening
    where: An office off the public floor, mid-morning.
    beats:
      - who: MANAGER
        line: Tell me about the counter work you've done. What have you handled face to face?
    ask: What do you say?
    options:
      - key: quick-learner
        text: Almost none, straight up. But I've never taken more than a week to learn a job.
        taken: She asks what the last job learned in a week was.
        then: scenario
        weight: 0

      - key: two-years
        text: Two years face to face. Payments, the same six questions all day, keeping the line moving.
        taken: She notes the two years.
        then: scenario
        weight: 2

      - key: on-paper
        text: Two years with the public. The day the system died, I ran the whole queue on paper.
        taken: She asks how long the system was down.
        then: scenario
        weight: 3

      - key: other-side
        text: I'm usually on the other side of the counter. But I've watched a lot of it done well.
        taken: She agrees that's one way to learn and turns to the next page.
        then: scenario
        weight: -4

  - key: scenario
    where: The same office, ten minutes in.
    beats:
      - who: MANAGER
        line: >-
          Someone at the window is upset about a refusal. The phone's ringing
          and a queue is building. Walk me through it.
    ask: What do you say?
    options:
      - key: queue-first
        text: The queue comes first — one person's bad day can't hold up nine others. They can wait.
        taken: She writes something down.
        then: close
        weight: 0

      - key: settle-them
        text: The upset one first. Drop my voice, hear them out — a queue waits better than a scene.
        taken: She nods and asks about the phone.
        then: close
        weight: 2

      - key: both-at-once
        text: Settle them, wave the next one forward between sentences, and log it to chase up later.
        taken: She asks who would pick up the phone.
        then: close
        weight: 3

      - key: unplug-it
        text: Unplug the phone, for a start. If it's important they'll ring back.
        taken: She looks at the phone on her own desk, then asks again about the person at the window.
        then: close
        weight: -4

  - key: close
    where: The same office, wrapping up.
    beats:
      - who: MANAGER
        line: >-
          The hours are fixed and the counter can't be left unstaffed. Is that
          workable, and when could you start?
    ask: What do you say?
    options:
      - key: any-give
        text: Mostly workable. Is there give in the mornings? Some weeks I'd need the odd late start.
        taken: She says the hours are the hours, and moves on.
        weight: 0

      - key: next-week
        text: Fixed hours are fine by me — I like knowing. I could start next week.
        taken: She notes next week.
        weight: 2

      - key: who-shows-me
        text: Workable. I can start Monday — who shows me the counter, and for how long?
        taken: She walks you through the first week.
        weight: 3

      - key: just-standing-there
        text: Can't be left at all? What if nobody's coming in? I'd just be standing there.
        taken: She confirms that you would be standing there, and that the standing is paid.
        weight: -4

outcomes:
  - key: not-this-one
    at-least: -12
    reaction: >-
      A letter arrives three days later: you have not been successful on this
      occasion. They wish you well in your search.

  - key: kept-on-file
    at-least: 4
    reaction: >-
      An email: no vacancy this month, but they've kept you on file and will
      call when one opens.

  - key: taken-on
    at-least: 7
    reaction: >-
      A call the next morning: they'd like you on the counter. Come in Thursday
      to sign.

  - key: start-monday
    at-least: 9
    reaction: >-
      Your phone rings before you're home: the counter's yours, start Monday.
      Come in Friday for the paperwork.
