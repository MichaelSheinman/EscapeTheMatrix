# The dispatch interview, minimal (content/challenges/SPEC.md, 2026-08-10).
#
# Three questions, four answers each, and nothing else. The scene-setting prose
# this file carried until now is gone: an interview is a real interview, and the
# first-person UI piece is where the room will come back.
#
# Weights are 0 / 2 / 3 for the three real answers and -4 for the troll one, so
# a single troll answer puts the best remaining run below the kept-on-file floor.
# Clicking the funny one costs the job, which is the price of seeing it.

scenes:
  - key: opening
    where: The transport office, Tuesday morning.
    beats:
      - who: MANAGER
        line: You've been on the dock two years. Why the move to the desk?
    ask: What do you say?
    options:
      - key: the-money
        text: The money, if I'm honest. Desk pays more than dock, and that's most of the thought.
        taken: He writes something down and moves to the next question.
        then: scenario
        weight: 0

      - key: daylight
        text: Two years of nights is enough. I'd like daylight and to sleep like a person again.
        taken: He nods and asks how many nights a week you're on now.
        then: scenario
        weight: 2

      - key: already-running-it
        text: I already run half the bay — who loads first, who's late, who covers. Make it official.
        taken: He asks who put you on that, and what the bay does when you're off.
        then: scenario
        weight: 3

      - key: the-rain
        text: Honestly? It rains on the dock. It doesn't rain in here. That's most of it.
        taken: He agrees that the office is dry and asks if there's anything else.
        then: scenario
        weight: -4

  - key: scenario
    where: The transport office, ten minutes in.
    beats:
      - who: MANAGER
        line: >-
          A driver calls in stuck behind an accident. Two delivery windows are
          at risk. What do you do?
    ask: What do you say?
    options:
      - key: slack
        text: He'll make it up. Those windows have slack in them or they wouldn't be windows.
        taken: He asks what happens if the slack isn't there.
        then: close
        weight: 0

      - key: ring-them
        text: Get on the phone to both customers before they ring us. New windows, apologies, done.
        taken: He notes it and asks about the driver.
        then: close
        weight: 2

      - key: reroute
        text: Pull whoever's nearest to grab one of the stops, then ring both customers with honest times.
        taken: He asks how you'd know who's nearest without ringing the whole fleet.
        then: close
        weight: 3

      - key: lunch
        text: I'd tell him to eat his lunch now. He's stuck anyway — no sense being stuck and hungry.
        taken: He says the drivers do like their lunch, and asks what happens to the two windows.
        then: close
        weight: -4

  - key: close
    where: The transport office, wrapping up.
    beats:
      - who: MANAGER
        line: >-
          That's what I needed. When can you start, and is there anything you
          want to ask me?
    ask: What do you say?
    options:
      - key: what-it-pays
        text: Before anything else — what's the desk pay? I've heard three different numbers.
        taken: He gives the figure and closes the folder.
        weight: 0

      - key: monday
        text: Monday suits me. I think you've covered everything I'd have asked.
        taken: He notes Monday and stands up.
        weight: 2

      - key: handover
        text: Monday. One question — who runs the desk now, and do I get a handover week with them?
        taken: He answers in detail and pulls up the roster to show you.
        weight: 3

      - key: after-my-holiday
        text: Right after my holiday. Three weeks, abroad, and I'd rather not be contactable.
        taken: He writes 'three weeks' in the margin and thanks you for your honesty.
        weight: -4

outcomes:
  - key: not-this-one
    at-least: -12
    reaction: >-
      The manager calls on Thursday. They've gone with someone who has
      dispatched before; he thanks you for coming in.

  - key: kept-on-file
    at-least: 4
    reaction: >-
      An email from the transport office: not this time, but they've kept your
      details for the next opening on the desk.

  - key: offered
    at-least: 7
    reaction: >-
      The manager calls: the desk is yours if you want it. Paperwork will be
      ready when you come in.

  - key: start-monday
    at-least: 9
    reaction: >-
      The manager calls the same evening: the desk is yours, start Monday.
      He'll have the roster ready for your handover.
