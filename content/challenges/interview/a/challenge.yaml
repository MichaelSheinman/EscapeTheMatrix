# The interview for the dispatch desk — the challenge behind §3.14's step up.
#
# HighLevelOverview.md §3.4: "**getting hired spawns an interview challenge** the
# player actually has to get through, rather than a dice roll — authored and
# deterministic like every other challenge (technical.md §5). **A live AI
# interview is a V2 addition.**" This is the authored one. Nothing about it is
# rolled and nothing about it is generated.
#
# It is also the second thing #25's line was drawn for. `dialogue_branch` already
# existed, so this is two YAML files and no Go — a challenge of a shape the type
# already runs is data, and an interview turns out to be that shape: people in a
# room, saying things, and a question you answer by committing to one reading of
# it.
#
# §3.10's register: this is an **Orange** one — achievement, career, negotiation
# — where the two `resolve_conflict` variants are Green. The register is
# production vocabulary and is never displayed (§3.2), which is why it appears
# in this comment and in no field.
#
# It names only `where`, and where is the desk in the warehouse office. That is
# not the whole of the gate: internal/career decides who may walk up to it —
# somebody standing exactly one rung below and reaching the requirement — and
# the framework never learns that this challenge is an interview. §4's
# availability half, with a second condition owned by the module the condition
# is about.

name: The dispatch interview
mechanic: dialogue_branch

where:
  places: [the-strip-warehouse]
  zones: [desk]
