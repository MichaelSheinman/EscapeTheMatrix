key: bez
name: Bez
among: wilmington
found: wilmington-corner-shop

note: Runs the corner shop, seven days a week.

age: 58

lives: >-
  44 Rowan St, the room at the back above the shop.

known: >-
  You buy your milk and bread from him.

texts: bursts

# How you met.
intro:
  - them: >-
      It's Bez, the shop. I wrote this number in the book so I know whose page is whose.
  - them: >-
      The book is what's owed and what's paid, nothing else. Nobody reads it but me.
  - you: >-
      Fair enough.
  - them: >-
      The shutter comes down slow, a full minute, so I'm out back a while after it's shut.
  - them: >-
      The yard door by the bins is the one that's open then. That's the one people use.
