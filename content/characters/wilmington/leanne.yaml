key: leanne
name: Leanne
among: wilmington
found: wilmington

note: Ground floor with her son. Her mother is in the care home on Moore Street.

age: 41

lives: >-
  12 Rowan St, flat 1C, with her son.

known: >-
  A neighbour, met on the step the week you moved in.

texts: rambles

# How you met.
intro:
  - them: >-
      It's Leanne from the ground floor, sorry to text you out of nowhere. I
      knocked this morning before my bus and got no answer, I didn't want to
      stand there banging in case you were sleeping, but my lad picked a key
      up off the front step yesterday and I've had it here since. He wouldn't
      put it down till I said I'd text you about it.
  - you: >-
      That's mine, I've been turning the flat over looking for it. Thanks
      Leanne.
  - them: >-
      Oh good, I'm glad. I'd have brought it up to you sooner only I'm at my
      mum's most mornings till her carer gets there, and by the time I'm back
      it's gone two, and then it's the lad and the tea and that, so the day
      goes and it went clean out of my head.
