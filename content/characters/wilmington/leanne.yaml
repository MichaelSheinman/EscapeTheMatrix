found: wilmington

note: Carries papers to doors around Wilmington.

age: 41

lives: >-
  12 Rowan St, apartment 1C, with her son.

known: >-
  Ground floor of your building, three flights under you.

texts: rambles

# How you met.
intro:
  - them: >-
      Hi, this is Leanne, 1C, the ground floor one. I put a note under your door about the bell and then
      thought that's ridiculous when you're right upstairs, so, here's the number instead. The bell hasn't
      worked since I moved in, people knock and then give up, and that is most of what happens at that
      door. Anyway. Now you have it.
  - you: >-
      Good to have it.
  - them: >-
      If you call in the day I probably won't pick up, and that isn't me ignoring you, I'm out on doors
      for the County Court, summonses, eviction notices, the small claims filings, and the phone stays in
      the car because you can't hold a phone and the paperwork at somebody's door at the same time.
      Evenings I'm in, once the route is done, and the route is whatever it is that day.
