key: ruthie
name: Ruthie
among: east-side
found: east-side

note: Keeps the rota for the stairwell, the bins, and the boiler man.

lives: >-
  Third floor of your building, front flat.

known: >-
  A neighbour, introduced the day you signed for the room.

texts: bursts

does: >-
  Will not decide anything until she has asked all four floors, and then
  treats the decision as everyone's even when only she wanted it.

# How you met.
intro:
  - them: >-
      Hiya, it's Ruthie, third floor front.
  - them: >-
      That sheet under your door's mine. Names and dates.
  - them: >-
      Stairwell and the bins, runs to the end of next month.
  - you: >-
      Just picked it up off the mat, thanks.
  - them: >-
      Have a read and say if anything on it's wrong, I'm asking all four
      floors.
  - them: >-
      Oh, and the water's off Tuesday morning, that's not on the sheet.
  - them: >-
      Boiler man's out to us again. He does the whole building in one go or
      not at all.
