# How you met.
intro:
  - them: >-
      Sharon, second floor, same stairs as you.
  - them: >-
      Boxes on the landing are my sister's. She's in with me now.
  - you: >-
      Wondered whose they were.
  - them: >-
      More of it than the flat holds.
  - them: >-
      My brother had the lot over in one run in his van.
