key: tomasz
name: Tomasz
among: east-side
found: east-side

note: Fixes things. Has never taken money for it from anyone in the building.

lives: >-
  Top floor of your building, at the back.

known: >-
  A neighbour, pointed out to you by name on the stairs.

texts: spare

does: >-
  Arrives with the right tool already in his hand, refuses payment twice,
  and asks a fortnight later whether you are any good with a van.

# How you met.
intro:
  - them: >-
      Your wardrobe is on the second turn. Tomasz, top floor.
  - them: >-
      Two men brought it that far and went.
  - you: >-
      They said they'd be back for it.
  - them: >-
      It will not go round whole. Mine went up in pieces, two screws a door.
  - them: >-
      My tools have not left that landing.
