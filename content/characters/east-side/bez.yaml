key: bez
name: Bez
among: east-side
found: east-side-corner-shop

note: Behind the till at the corner shop, six days out of seven.

lives: >-
  Above the shop, in the back room facing the yard.

known: >-
  The man behind the till at the corner shop.

texts: bursts

does: >-
  Lets it ride until Friday without being asked, and remembers the amount
  exactly while insisting he does not.

# What somebody here has heard about somewhere else (§3.15's
# recommendation). Gossip: a place mentioned for their own reasons, with
# nothing in it about how the people over there behave and nothing about
# what would happen to your answers if you went.
elsewhere:
  where: riverfront
  says: >-
    My cousin took a floor of a converted office on Water Street. Pays what
    this whole building pays and says the lift runs all night. There are
    rooms going on that landing, if you ever wanted them.

# How you met.
intro:
  - them: >-
      Bez, corner shop.
  - them: >-
      Your card's under my till.
  - them: >-
      Queue to the fridges, couldn't shout after you.
  - you: >-
      Thought I'd lost it. How late are you open?
  - them: >-
      Nine.
  - them: >-
      It's in the book with what people owe, it'll keep.
  - them: >-
      Down from six if you're early. Yard door by the bins, shutter's slow.
