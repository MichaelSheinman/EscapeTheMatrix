# The population the player starts among (§3.15).
#
# Cooperative, trusting, consensus-seeking — the worked example's first half,
# written entirely as behaviour. Nothing here names a register, a stage or a
# framework, and nothing here says these people are good; what the file states is
# what they *do*, which is the only thing a player is ever shown.
#
# Its affordances are the design's own phrase for this shape of place: low money
# ceiling, high relational reward. There is a great deal of helping to be done
# and almost no money to be made, and the range of situations is narrow — the
# same six people, the same stairwell — which is what caps emotional stability
# well below what money's absence would suggest.

key: east-side
note: >-
  The people on your landing, behind the till, and folding somebody else's
  sheets at ten at night. Everybody knows what everybody is short of.

holds:
  - >-
    A favour asked is a favour done, and nobody writes it down. Keeping a count
    out loud is the rude part, not the asking.
  - >-
    Anything that affects the building is settled in the stairwell, out loud,
    and it is not settled until everyone has said their piece.
  - >-
    Somebody who is struggling gets carried, and it is not mentioned to them
    afterwards.
  - >-
    Handling it alone reads as thinking you are better than the rest, whatever
    it is and however well it went.
  - >-
    A stranger is somebody nobody has introduced yet, and that is treated as an
    oversight rather than as a fact about them.

affords:
  # A hundred and twenty thousand dollars is the most money there is any use for
  # here — not a rule about what a player may hold, a statement about what this
  # place can turn money into.
  money: 12000000
  # A wide, warm range of chances to help, and a narrow range of kinds of
  # situation to respond to (§3.15: the cap is exposure, not cause).
  stability: 70
  kindness: 88

people:
  - key: yolanda
    name: Yolanda
    note: Two doors up. Has a key to four flats and has never once mentioned it.
    found: east-side
    does: >-
      Turns up with the thing you needed before you have said you needed it, and
      is embarrassed if you thank her for it twice.

  - key: bez
    name: Bez
    note: Behind the till at the corner shop, six days out of seven.
    found: east-side-corner-shop
    does: >-
      Lets it ride until Friday without being asked, and remembers the amount
      exactly while insisting he does not.

  - key: auntie-pat
    name: Auntie Pat
    note: Nobody's actual aunt. Has the third dryer from the end and always has.
    found: east-side-laundromat
    does: >-
      Asks after somebody's mother by name, then tells you what she has heard,
      then tells you what she thinks you should do about it.

  - key: deshaun
    name: Deshaun
    note: Works the desk at the walk-in clinic and lives three streets over.
    found: east-side-clinic
    does: >-
      Finds you a slot that was not there, and will not hear that it was a
      favour because it would mean somebody else had to wait.

  - key: ruthie
    name: Ruthie
    note: Keeps the rota for the stairwell, the bins, and the boiler man.
    found: east-side
    does: >-
      Will not decide anything until she has asked all four floors, and then
      treats the decision as everyone's even when only she wanted it.

  - key: tomasz
    name: Tomasz
    note: Fixes things. Has never taken money for it from anyone in the building.
    found: east-side
    does: >-
      Arrives with the right tool already in his hand, refuses payment twice,
      and asks a fortnight later whether you are any good with a van.

# What somebody here has heard about somewhere else (§3.15's recommendation).
#
# Gossip, and nothing more than gossip. Bez hears everything at the till and
# repeats about half of it, and he is passing on a thing his cousin told him
# because it is interesting — not because anybody worked out it would be good
# for you. There is nothing in it about how the people over there behave and
# nothing about what would happen to your answers if you went, because a
# recommendation that explained the lesson would have taught it (§3.2).
elsewhere:
  who: bez
  where: riverfront
  says: >-
    My cousin took a floor of a converted office on Water Street. Pays what this
    whole building pays and says the lift runs all night. There are rooms going
    on that landing, if you ever wanted them.
