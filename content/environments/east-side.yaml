# The population the player starts among (§3.15).
#
# Cooperative, trusting, consensus-seeking — the worked example's first half,
# written entirely as behaviour. Nothing here names a register, a stage or a
# framework, and nothing here says these people are good; what the file states is
# what they *do*, which is the only thing a player is ever shown.
#
# Its affordances are the design's own phrase for this shape of place: low money
# ceiling, high relational reward. There is a great deal of helping to be done
# and almost no money to be made, and the range of situations is narrow — the
# same six people, the same stairwell — which is what caps emotional stability
# well below what money's absence would suggest.

key: east-side
note: >-
  The people on your landing, behind the till, and folding somebody else's
  sheets at ten at night. Everybody knows what everybody is short of.

holds:
  - >-
    A favour asked is a favour done, and nobody writes it down. Keeping a count
    out loud is the rude part, not the asking.
  - >-
    Anything that affects the building is settled in the stairwell, out loud,
    and it is not settled until everyone has said their piece.
  - >-
    Somebody who is struggling gets carried, and it is not mentioned to them
    afterwards.
  - >-
    Handling it alone reads as thinking you are better than the rest, whatever
    it is and however well it went.
  - >-
    A stranger is somebody nobody has introduced yet, and that is treated as an
    oversight rather than as a fact about them.

affords:
  # A hundred and twenty thousand dollars is the most money there is any use for
  # here — not a rule about what a player may hold, a statement about what this
  # place can turn money into.
  money: 12000000
  # A wide, warm range of chances to help, and a narrow range of kinds of
  # situation to respond to (§3.15: the cap is exposure, not cause).
  stability: 70
  kindness: 88

# The people who live here are authored one to a file under
# content/characters/east-side/, along with how each of them is introduced.

# Capitalised things this population's prose may name that are not its people.
# Anything capitalised that is neither a neighbour nor on this list fails the
# build, so a name in a message is always somebody the player can look up.
nouns:
  - Denny's
  - Moore Street
  - Water Street
