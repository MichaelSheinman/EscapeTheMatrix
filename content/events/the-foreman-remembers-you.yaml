key: the-foreman-remembers-you
name: The foreman remembers you
kind: work
surface: world

line: >-
  The foreman stops you in the office doorway. He has regular night work going
  — three or four shifts a week, same cash rate as the one-offs — and wants to
  know if you want your name against it.

accept: Hear him out
decline: Keep walking
after: >-
  He says he will keep you in mind for the next one and writes nothing down.

where:
  places: [the-strip-loading-bay, the-strip-warehouse, the-strip]
  zones: [dock, doorway, on-foot]

patience: 14
weight: 5
