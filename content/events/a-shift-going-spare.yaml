# `awaits: true` — accepting this opens something the event system does not
# finish. §4 is explicit that an event *can* offer a challenge and that the two
# are distinct systems; this is what that looks like from the backlog's side.
# The record stays pending until whichever module ran the thing calls Resolve
# (#23's challenge runs, #28's job situations, #30's conflicts).
#
# It is also why `after` is empty here. An event that says what accepting came
# to before anything has happened would be writing the outcome in advance.

key: a-shift-going-spare
name: A shift going spare
surface: world

line: >-
  The foreman is two people short on tonight's unload. Eight hours from ten,
  ninety dollars cash at the end of it, starting now.

accept: Take the shift
decline: Say you have somewhere to be
awaits: true

where:
  places: [wilmington-loading-bay, wilmington-freight]
  zones: [dock]

patience: 14
again: 10
then: the-foreman-remembers-you
weight: 6
