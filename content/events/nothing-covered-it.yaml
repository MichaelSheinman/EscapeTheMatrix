# `raised: true` — this is never generated. It is put into the backlog by
# internal/event's Raise, which is called when internal/playbook reports an
# escalation, which happens on technical.md §4's first condition: no rule
# matched.
#
# It is authored content rather than a synthesised line for the same reason
# every other event is: the catalogue is the writing (§5.2), and a moment
# assembled out of column values at release time would read like one.
#
# `where` is deliberately almost everywhere. An escalation that could only be
# delivered at home would sit in the backlog for as long as the player stayed
# out, which is exactly the silence the three-condition rule exists to prevent.

key: nothing-covered-it
name: Nothing covered it
kind: interpersonal
surface: queue
raised: true

line: >-
  Nothing in your playbook covered this one, so you answered it off the top of
  your head. The moment is below.

accept: Read it back
decline: Let it go for now

after: >-
  You read it back. There is still nothing in your playbook that covers a
  moment like it, and answering the next one is still yours to do.

where:
  layers: [district, interior, home]
  zones: [on-foot, at-home, seats, window, doorway]

patience: 7
weight: 9
