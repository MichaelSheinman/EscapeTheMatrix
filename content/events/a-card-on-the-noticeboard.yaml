key: a-card-on-the-noticeboard
name: A card on the noticeboard
kind: opportunity
surface: world

line: >-
  Between a lost cat and a room to let there is an index card, handwritten,
  offering money for two evenings a week of something the card is careful not
  to name.

accept: Take a tab off the bottom
decline: Read it twice and leave it there
after: >-
  The number goes in your phone. Whether you call it is a decision you have
  now arranged to have to make later.

where:
  layers: [interior]
  zones: [seats, counter, doorway]

patience: 30
again: 21
weight: 3
