<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Matrix — client preview</title>
<link rel="stylesheet" href="../ui/index.css">
</head>
<body>

<!-- One canvas, edge to edge. Every element below floats over it, and
     none of them is a menu: nothing here leads anywhere you could not
     have reached by walking. -->
<div class="app">

  <div class="viewport" id="viewport">
    <canvas id="world"></canvas>
    <div class="markers" id="markers"></div>
    <div class="nameplate" id="nameplate"></div>
    <div class="prompt" id="prompt"></div>
    <div class="world-card" id="worldcard"></div>
    <div class="vignette"></div>
    <div class="grade"></div>
  </div>

  <div class="place-chip" id="placeChip"></div>
  <div class="env-chip" id="envChip"></div>

  <div id="pods"></div>

  <div class="view-controls">
    <button class="view-btn on" id="followBtn" data-follow title="Follow the character (F)">⌖ Follow</button>
    <button class="view-btn" data-zoom="out" title="Zoom out">&minus;</button>
    <button class="view-btn" data-zoom="in" title="Zoom in">+</button>
    <button class="view-btn" data-quality title="Effects tier (Q)"><span id="qualityLabel">Effects: high</span></button>
  </div>

  <div class="keybar" id="keybar"></div>

  <!-- The corner you reach for: what arrived, what the keys do, and the two
       buttons that open them. One column, so nothing can overlap. -->
  <div class="corner">
    <div class="toasts" id="toasts"></div>
    <div class="keycard" id="keycard"></div>
    <div class="corner-btns">
      <button class="corner-btn help" id="helpBtn" title="Every shortcut (?)"></button>
      <button class="corner-btn phone" id="phone" data-panel="inbox" title="Your phone (C)"></button>
    </div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="overlay-scrim" data-close></div>
  <div class="overlay-panel">
    <button class="overlay-close" data-close aria-label="Close"><kbd class="keycap">Esc</kbd> back to the world</button>
    <div class="page-head" id="panelHead">
      <h1 class="page-title" id="panelTitle"></h1>
      <p class="page-sub" id="panelSub"></p>
    </div>
    <div id="panelBody"></div>
  </div>
</div>

<!-- Modules, so the preview consumes @etm/ui the same way web/ will.
     They execute in order after parsing; each still publishes onto window.ETM. -->
<script type="module" src="src/render.js"></script>
<script type="module" src="src/scenes.js"></script>
<script type="module" src="src/panels.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
